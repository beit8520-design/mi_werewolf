<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>高校狼人殺 - 教室疑案迷霧</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@600;800;900&display=swap');
    
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Noto Sans TC', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background: #090910;
    }

    .comic-font {
      font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
    }

    /* 仿日系暗黑懸疑風黑板框 */
    .board-container {
      background: #181824;
      border: 4px solid #2e2e42;
      box-shadow: 0 10px 25px rgba(0,0,0,0.9), inset 0 0 14px rgba(0,0,0,0.7);
    }

    /* 教室黑板 */
    .parchment-inner {
      background: #0c2b26;
      box-shadow: inset 0 0 16px rgba(0,0,0,0.85);
      border: 2px solid #0f463d;
    }

    /* 課桌卡牌 */
    .char-card {
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      background: #cbd5e1;
      border: 2px solid #475569;
    }
    .char-card:active {
      transform: scale(0.95);
    }

    /* 正確好人同學 */
    .revealed-good {
      background: #86efac !important;
      border-color: #15803d !important;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.85);
    }

    /* 偽裝狼人真身 */
    .revealed-wolf {
      background: #fca5a5 !important;
      border-color: #b91c1c !important;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.85);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-anim {
      animation: shake 0.35s ease-in-out;
    }
  </style>
</head>
<body class="h-[100dvh] flex flex-col items-center justify-between p-1.5 sm:p-2 text-white overflow-hidden">

  <!-- 頂部資訊列 (極簡高度) -->
  <header class="w-full max-w-md flex items-center justify-between px-1 py-0.5 mb-1 flex-shrink-0">
    <button onclick="toggleLevelModal()" class="flex items-center gap-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-2.5 py-1 rounded-xl text-xs shadow-md border-2 border-amber-300">
      <span>📂 案件</span>
      <span id="caseNavText">第 1/50 案</span>
    </button>
    <div class="flex items-center gap-1.5">
      <span id="difficultyBadge" class="text-[9px] font-black px-2 py-0.5 rounded-lg border bg-rose-950 border-rose-500 text-rose-300">
        高壓突襲
      </span>
      <div class="flex items-center gap-1 bg-slate-900/90 px-2 py-0.5 rounded-xl border border-slate-700 text-xs shadow">
        <span>❤️</span>
        <span id="livesDisplay" class="font-black text-rose-400">❤️❤️❤️</span>
      </div>
      <button onclick="toggleAudio()" id="audioBtn" class="bg-slate-800 px-1.5 py-0.5 rounded-xl text-xs border border-slate-600">🔊</button>
    </div>
  </header>

  <!-- 遊戲主盤面：嚴格單頁填滿 (flex-1 + min-h-0) -->
  <main id="mainBoard" class="w-full max-w-md board-container rounded-2xl p-1.5 flex flex-col items-center relative flex-1 min-h-0 overflow-hidden">
    
    <!-- 頂部狀態面板 -->
    <div class="w-full flex items-center justify-between bg-slate-900/90 rounded-xl px-2 py-1 border border-slate-700 mb-1 flex-shrink-0">
      <div class="flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded-lg border border-rose-900/60">
        <span class="text-sm">🐺</span>
        <span id="wolvesRemaining" class="text-rose-400 font-black font-mono text-xs">4</span>
        <span class="text-[9px] text-slate-300">隻狼生</span>
      </div>

      <div class="flex items-center gap-1 text-[10px] bg-slate-950 px-2 py-0.5 rounded-lg border border-slate-800 text-slate-300">
        <span>已揪出：</span>
        <span id="clearedCount" class="font-mono text-amber-300 font-black">0</span>
        <span id="totalCount">/ 18</span>
      </div>

      <div class="flex items-center gap-1 font-black text-amber-300 comic-font text-xs">
        <span class="w-2 h-2 bg-amber-400 rounded-xs inline-block"></span>
        <span id="boardCaseIndicator">1/50</span>
      </div>
    </div>

    <!-- 教室座次表網格 4x5：保證等比填滿整頁高度 -->
    <div class="w-full parchment-inner rounded-xl p-1 relative flex-1 min-h-0 flex flex-col justify-center overflow-hidden">
      <div id="gridBoard" class="grid grid-cols-4 grid-rows-5 gap-1 w-full h-full">
      </div>
    </div>

    <!-- 底部展開式發言提示窗 -->
    <div id="selectedHintBox" class="w-full bg-slate-950 border border-sky-400 rounded-xl px-2.5 py-1 mt-1 text-xs flex items-center gap-2 shadow-lg flex-shrink-0">
      <span class="text-base flex-shrink-0">💬</span>
      <div class="flex-1 overflow-hidden leading-tight">
        <div id="hintSpeaker" class="font-black text-sky-300 text-[10px]">同學八卦筆記板</div>
        <div id="hintQuote" class="text-white text-xs font-bold truncate mt-0.5">點選上方卡片查看完整證詞，推敲出所有狼人！</div>
      </div>
    </div>
  </main>

  <!-- 點擊卡牌查驗彈窗 -->
  <div id="actionModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div class="bg-slate-900 border-4 border-sky-400 w-full max-w-xs rounded-2xl p-4 text-center shadow-2xl relative">
      <div class="w-24 h-24 mx-auto rounded-xl bg-slate-800 border-2 border-sky-400/50 p-1 mb-2 overflow-hidden flex items-center justify-center" id="actionModalAvatar">
      </div>
      <h3 class="text-base font-black text-sky-300 comic-font mb-0.5" id="actionModalName">選擇身份</h3>
      <p class="text-[11px] text-sky-200/90 mb-3 bg-slate-950 p-2.5 rounded-xl border border-slate-800 leading-normal font-bold" id="actionModalCluePreview"></p>

      <div class="grid grid-cols-2 gap-2 mb-2">
        <button onclick="chooseIdentity('good')" class="py-2.5 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-black rounded-xl border border-emerald-300 shadow flex flex-col items-center gap-0.5">
          <span class="text-xl">🎓</span>
          <span class="text-xs">這是同學 (好人)</span>
        </button>
        <button onclick="chooseIdentity('wolf')" class="py-2.5 bg-rose-600 hover:bg-rose-500 active:scale-95 text-white font-black rounded-xl border border-rose-300 shadow flex flex-col items-center gap-0.5">
          <span class="text-xl">🐺</span>
          <span class="text-xs">這是狼人 (壞人)</span>
        </button>
      </div>

      <button onclick="closeActionModal()" class="w-full py-1.5 bg-slate-800 text-slate-400 hover:text-white font-bold text-xs rounded-lg mt-0.5">
        取消
      </button>
    </div>
  </div>

  <!-- 關卡選單 Modal -->
  <div id="levelModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div class="bg-slate-900 border-2 border-sky-400 w-full max-w-sm rounded-2xl p-3 shadow-2xl flex flex-col max-h-[82vh]">
      <div class="flex items-center justify-between pb-2 border-b border-slate-800">
        <h3 class="font-black text-sky-300 text-sm comic-font">案件卷宗 (高低難度隨機穿插)</h3>
        <button onclick="toggleLevelModal()" class="text-white font-mono text-lg">✕</button>
      </div>
      <div class="grid grid-cols-5 gap-1.5 overflow-y-auto py-2 my-1" id="levelGridContainer">
      </div>
    </div>
  </div>

  <!-- 勝負結果彈窗 -->
  <div id="resultModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-3">
    <div id="resultBox" class="bg-slate-900 border-4 w-full max-w-xs rounded-2xl p-4 text-center shadow-2xl">
      <div id="resultEmoji" class="text-4xl mb-1">🎉</div>
      <h3 id="resultTitle" class="text-lg font-black comic-font mb-1">推敲成功！</h3>
      <p id="resultDesc" class="text-xs text-slate-300 mb-3 leading-relaxed">守護了班級的平靜，偽裝狼人全數被抓出！</p>
      
      <button id="resultBtn" onclick="onResultBtnClick()" class="w-full py-2 bg-gradient-to-r from-sky-400 to-indigo-500 text-slate-950 font-black rounded-xl text-sm comic-font shadow-md">
        前往下一案 ➔
      </button>
    </div>
  </div>

  <script>
    /* =====================================================================
       1. 學生資料與副檔名備援
       ===================================================================== */
    const ROLES_LIST = [
      { name: '柳氓(不良)', fileBase: 'student-01', isFemale: false, hasGlasses: false },
      { name: '娜拉(墨鏡)', fileBase: 'student-02', isFemale: true,  hasGlasses: true },
      { name: '富帥(潮男)', fileBase: 'student-03', isFemale: false, hasGlasses: true },
      { name: '歐娜娜(病嬌)', fileBase: 'student-04', isFemale: true, hasGlasses: false },
      { name: '蔣不通(苦惱)', fileBase: 'student-05', isFemale: false, hasGlasses: false },
      { name: '若若希(捲髮)', fileBase: 'student-06', isFemale: true,  hasGlasses: false },
      { name: '阿豪(西裝)', fileBase: 'student-07', isFemale: false, hasGlasses: false },
      { name: '阿Gen(刺蝟)', fileBase: 'student-08', isFemale: false, hasGlasses: true },
      { name: '雙丸子(墨鏡)', fileBase: 'student-09', isFemale: true,  hasGlasses: true },
      { name: '沐照(班長)', fileBase: 'student-10', isFemale: true,  hasGlasses: true },
      { name: '阿澤(理科)', fileBase: 'student-11', isFemale: false, hasGlasses: true },
      { name: '紫亮(刺頭)', fileBase: 'student-12', isFemale: false, hasGlasses: false },
      { name: '夏天(風紀)', fileBase: 'student-13', isFemale: true,  hasGlasses: false }
    ];

    function handleImgError(imgEl, fileBase) {
      const extensions = ['.PNG', '.jpg', '.png', '.jpeg'];
      let currentSrc = imgEl.getAttribute('data-attempt') || '0';
      let attempt = parseInt(currentSrc);
      if (attempt < extensions.length) {
        imgEl.setAttribute('data-attempt', (attempt + 1).toString());
        imgEl.src = fileBase + extensions[attempt];
      }
    }

    const COLS = ['A', 'B', 'C', 'D'];
    const ROWS = [1, 2, 3, 4, 5];
    const GAME_LEVELS = [];

    /* =====================================================================
       2. 多維度題型生成庫 (徹底去重，杜絕千篇一律的「周圍沒有狼」)
       ===================================================================== */
    (function generateVibrantCampusLevels() {
      for (let lvl = 1; lvl <= 50; lvl++) {
        let wolfNum = 3;
        let initialClueCount = 3;
        let diffName = "⚡ 高壓突襲";
        let diffColor = "bg-rose-950 border-rose-500 text-rose-300";

        const wave = (lvl * 7) % 10;
        if (wave <= 2) {
          wolfNum = 3; initialClueCount = 3;
          diffName = "★ 班級私語 (速解)";
          diffColor = "bg-emerald-950 border-emerald-500 text-emerald-300";
        } else if (wave <= 5) {
          wolfNum = 4; initialClueCount = 3;
          diffName = "★★ 課後疑雲 (進階)";
          diffColor = "bg-sky-950 border-sky-500 text-sky-300";
        } else if (wave <= 8) {
          wolfNum = 5; initialClueCount = 2;
          diffName = "★★★ 深夜狼嗥 (燒腦)";
          diffColor = "bg-amber-950 border-amber-500 text-amber-300";
        } else {
          wolfNum = 6; initialClueCount = 2;
          diffName = "💀 血月屠榜 (極難)";
          diffColor = "bg-rose-950 border-rose-500 text-rose-300";
        }

        if (lvl === 1) {
          wolfNum = 4; initialClueCount = 3;
          diffName = "⚡ 第一案·班級狼影";
          diffColor = "bg-amber-950 border-amber-500 text-amber-300";
        }

        const disabledCoords = (lvl % 2 === 1) ? ['A1', 'A4'] : ['D1', 'C5'];
        const validCoords = [];
        COLS.forEach(c => {
          ROWS.forEach(r => {
            const coord = `${c}${r}`;
            if (!disabledCoords.includes(coord)) validCoords.push(coord);
          });
        });

        const wolfCoords = [];
        const shuffled = [...validCoords].sort(() => 0.5 - Math.sin(lvl * 19.3 + 5.1));
        for (let w = 0; w < wolfNum; w++) {
          wolfCoords.push(shuffled[w]);
        }

        const assignedStudents = [...ROLES_LIST].sort(() => 0.5 - Math.sin(lvl * 13.1 + Math.random()));
        const gridCells = {};
        const goodCoords = [];

        validCoords.forEach((coord, idx) => {
          const isWolf = wolfCoords.includes(coord);
          if (!isWolf) goodCoords.push(coord);
          const studentProfile = assignedStudents[idx % assignedStudents.length];

          gridCells[coord] = {
            coord: coord,
            col: coord[0],
            row: parseInt(coord[1]),
            name: studentProfile.name,
            isFemale: studentProfile.isFemale,
            hasGlasses: studentProfile.hasGlasses,
            isWolf: isWolf,
            fileBase: studentProfile.fileBase,
            disabled: false,
            clue: ""
          };
        });

        const usedSignatures = new Set();
        let zeroNeighborUsed = false;

        goodCoords.forEach((coord) => {
          const cell = gridCells[coord];
          const c = cell.col;
          const r = cell.row;
          const cIdx = COLS.indexOf(c);

          const rowWolves = wolfCoords.filter(w => w[1] == r).length;
          const colWolves = wolfCoords.filter(w => w[0] == c).length;

          // 十字相鄰
          const crossNeighbors = [
            `${COLS[cIdx - 1]}${r}`, `${COLS[cIdx + 1]}${r}`,
            `${c}${r - 1}`, `${c}${r + 1}`
          ];
          const crossWolves = wolfCoords.filter(w => crossNeighbors.includes(w)).length;

          // 斜角 4 格
          const diagNeighbors = [
            `${COLS[cIdx - 1]}${r - 1}`, `${COLS[cIdx + 1]}${r - 1}`,
            `${COLS[cIdx - 1]}${r + 1}`, `${COLS[cIdx + 1]}${r + 1}`
          ];
          const diagWolves = wolfCoords.filter(w => diagNeighbors.includes(w)).length;

          // 墨鏡眼鏡
          const glassesWolves = wolfCoords.filter(w => gridCells[w] && gridCells[w].hasGlasses).length;

          // 方向射線
          const leftCoords = COLS.slice(0, cIdx).map(nc => `${nc}${r}`);
          const rightCoords = COLS.slice(cIdx + 1).map(nc => `${nc}${r}`);
          const frontCoords = ROWS.slice(0, r - 1).map(nr => `${c}${nr}`);
          const backCoords = ROWS.slice(r).map(nr => `${c}${nr}`);

          const leftWolves = wolfCoords.filter(w => leftCoords.includes(w)).length;
          const rightWolves = wolfCoords.filter(w => rightCoords.includes(w)).length;
          const frontWolves = wolfCoords.filter(w => frontCoords.includes(w)).length;
          const backWolves = wolfCoords.filter(w => backCoords.includes(w)).length;

          // 性別
          const femaleInCol = wolfCoords.filter(w => gridCells[w] && gridCells[w].col === c && gridCells[w].isFemale).length;
          const maleInRow = wolfCoords.filter(w => gridCells[w] && gridCells[w].row === r && !gridCells[w].isFemale).length;

          // 區域
          const windowWolves = wolfCoords.filter(w => w[0] === 'A' || w[0] === 'B').length;
          const doorWolves = wolfCoords.filter(w => w[0] === 'C' || w[0] === 'D').length;

          const otherGood = goodCoords.find(gc => gc !== coord && gc[0] !== c && gc[1] !== r);
          const aWolf = wolfCoords[0];

          const generatorPool = [];

          // 墨鏡特徵題
          if (!usedSignatures.has(`glasses`)) {
            generatorPool.push({
              sig: `glasses`,
              text: glassesWolves === 0 ? `戴墨鏡/眼鏡的人全好人` : `戴墨鏡者中有${glassesWolves}隻狼`
            });
          }

          // 射線方向題 (向右)
          if (rightCoords.length >= 2 && !usedSignatures.has(`right_${r}`)) {
            generatorPool.push({
              sig: `right_${r}`,
              text: `右手邊線上共有${rightWolves}隻狼`
            });
          }

          // 射線方向題 (向左)
          if (leftCoords.length >= 2 && !usedSignatures.has(`left_${r}`)) {
            generatorPool.push({
              sig: `left_${r}`,
              text: `左手邊線上共有${leftWolves}隻狼`
            });
          }

          // 射線方向題 (向前黑板)
          if (frontCoords.length >= 2 && !usedSignatures.has(`front_${c}`)) {
            generatorPool.push({
              sig: `front_${c}`,
              text: `正前方直線上藏${frontWolves}隻狼`
            });
          }

          // 射線方向題 (向後門)
          if (backCoords.length >= 2 && !usedSignatures.has(`back_${c}`)) {
            generatorPool.push({
              sig: `back_${c}`,
              text: `正後方直線上共${backWolves}隻狼`
            });
          }

          // 性別排除題
          if (!usedSignatures.has(`col_fem_${c}`)) {
            generatorPool.push({
              sig: `col_fem_${c}`,
              text: femaleInCol === 0 ? `${c}列女生全都是好人` : `${c}列女生中有${femaleInCol}隻狼`
            });
          }

          if (!usedSignatures.has(`row_male_${r}`)) {
            generatorPool.push({
              sig: `row_male_${r}`,
              text: maleInRow === 0 ? `第${r}排男生全都是好人` : `第${r}排男生藏${maleInRow}隻狼`
            });
          }

          // 斜角對角題
          if (!usedSignatures.has(`diag_${coord}`)) {
            generatorPool.push({
              sig: `diag_${coord}`,
              text: diagWolves === 0 ? `斜對角四格全是好人` : `斜對角座位藏${diagWolves}隻狼`
            });
          }

          // 區域宏觀對比
          if (!usedSignatures.has(`window_door`)) {
            generatorPool.push({
              sig: `window_door`,
              text: windowWolves === doorWolves 
                ? `靠窗區與靠門區狼數相等` 
                : (windowWolves > doorWolves ? `靠窗邊（A/B列）狼較多` : `靠門邊（C/D列）狼較多`)
            });
          }

          // 互斥二選一
          if (aWolf && otherGood && !usedSignatures.has(`mutual_${otherGood}`)) {
            generatorPool.push({
              sig: `mutual_${otherGood}`,
              text: `【${otherGood}】與【${aWolf}】中恰1狼`
            });
          }

          // 好人背書
          if (otherGood && !usedSignatures.has(`friend_${otherGood}`)) {
            generatorPool.push({
              sig: `friend_${otherGood}`,
              text: `神探！【${otherGood}】絕對是好人`
            });
          }

          // 十字相鄰題
          if (crossWolves > 0 && !usedSignatures.has(`cross_${crossWolves}`)) {
            generatorPool.push({
              sig: `cross_${crossWolves}`,
              text: `周圍十字鄰格藏${crossWolves}匹狼`
            });
          } else if (crossWolves === 0 && !zeroNeighborUsed) {
            zeroNeighborUsed = true;
            generatorPool.push({
              sig: `zero_neighbor`,
              text: `周圍上下左右沒有狼`
            });
          }

          let selected = generatorPool.find(item => !usedSignatures.has(item.sig));

          if (selected) {
            usedSignatures.add(selected.sig);
            cell.clue = selected.text;
          } else {
            const fallbackSig = `fallback_${c}${r}`;
            usedSignatures.add(fallbackSig);
            cell.clue = `${c}列與第${r}排交叉安全`;
          }
        });

        disabledCoords.forEach(dc => {
          gridCells[dc] = { coord: dc, disabled: true };
        });

        const initialClueCoords = [];
        const shuffledGoods = [...goodCoords].sort(() => 0.5 - Math.sin(lvl * 9.3));
        for (let i = 0; i < Math.min(initialClueCount, shuffledGoods.length); i++) {
          initialClueCoords.push(shuffledGoods[i]);
        }

        GAME_LEVELS.push({
          levelId: lvl,
          wolfCount: wolfNum,
          totalValid: validCoords.length,
          diffName: diffName,
          diffColor: diffColor,
          gridCells: gridCells,
          initialClueCoords: initialClueCoords
        });
      }
    })();

    /* =====================================================================
       3. 音效合成器與流程控制
       ===================================================================== */
    let currentLevelIndex = 0;
    let revealedStatus = {};
    let displayedClues = {};
    let mistakes = 0;
    let activeSelectingCoord = null;
    let soundEnabled = true;

    const SoundFx = {
      ctx: null,
      beep(freq, duration = 0.1, type = 'sine') {
        if (!soundEnabled) return;
        try {
          if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.value = 0.15;
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      },
      click() { this.beep(440, 0.05, 'square'); },
      goodReveal() { this.beep(587, 0.12, 'triangle'); },
      wolfCaught() { this.beep(200, 0.28, 'sawtooth'); },
      wrong() { this.beep(150, 0.38, 'sawtooth'); },
      win() { [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => this.beep(f, 0.18, 'triangle'), i * 80)); },
      lose() { [320, 260, 200, 140].forEach((f, i) => setTimeout(() => this.beep(f, 0.25, 'sawtooth'), i * 90)); }
    };

    function toggleAudio() {
      soundEnabled = !soundEnabled;
      document.getElementById('audioBtn').innerText = soundEnabled ? '🔊' : '🔇';
    }

    function initLevel() {
      const lvl = GAME_LEVELS[currentLevelIndex];
      revealedStatus = {};
      displayedClues = {};
      mistakes = 0;
      updateLivesUI();

      lvl.initialClueCoords.forEach(c => {
        displayedClues[c] = true;
      });

      document.getElementById('caseNavText').innerText = `第 ${lvl.levelId}/50 案`;
      document.getElementById('boardCaseIndicator').innerText = `${lvl.levelId}/50`;
      document.getElementById('wolvesRemaining').innerText = lvl.wolfCount;
      document.getElementById('clearedCount').innerText = '0';
      document.getElementById('totalCount').innerText = `/ ${lvl.totalValid}`;
      
      const badge = document.getElementById('difficultyBadge');
      badge.innerText = lvl.diffName;
      badge.className = `text-[9px] font-black px-2 py-0.5 rounded-lg border ${lvl.diffColor}`;

      document.getElementById('hintSpeaker').innerText = "教室八卦線索：";
      document.getElementById('hintQuote').innerText = `本案潛伏 ${lvl.wolfCount} 隻狼！點擊卡片查看證詞，推敲出所有狼人！`;

      const gridBoard = document.getElementById('gridBoard');
      gridBoard.innerHTML = '';

      ROWS.forEach(r => {
        COLS.forEach(c => {
          const coord = `${c}${r}`;
          const cellData = lvl.gridCells[coord];
          const cellEl = document.createElement('div');

          if (!cellData || cellData.disabled) {
            cellEl.className = "w-full h-full rounded-lg bg-slate-800/40 border border-slate-700/40 flex items-center justify-center opacity-40";
            cellEl.innerHTML = `<span class="text-xl text-slate-400">🚫</span>`;
          } else {
            cellEl.id = `card-${coord}`;
            cellEl.className = "char-card rounded-lg flex flex-col justify-between items-center relative cursor-pointer shadow-sm overflow-hidden bg-slate-100 border border-slate-500";
            cellEl.onclick = () => onCardClicked(coord);

            const hasBubble = displayedClues[coord] && cellData.clue;

            cellEl.innerHTML = `
              <!-- 卡片頂部座標與性別標記 -->
              <div class="w-full flex justify-between items-center px-1 text-[9px] font-black text-slate-800 bg-white/90 border-b border-slate-300 leading-none py-0.5 flex-shrink-0 z-10">
                <span class="font-mono text-indigo-900 font-bold">${coord}</span>
                <span>${cellData.isFemale ? '♀️' : '♂️'}</span>
              </div>

              <!-- 完整半身像展示區 (object-contain 保持全貌不截斷) -->
              <div class="w-full flex-1 overflow-hidden flex items-center justify-center relative p-0.5 min-h-0 bg-slate-200" id="avatar-${coord}">
                <img src="${cellData.fileBase}.PNG" onerror="handleImgError(this, '${cellData.fileBase}')" class="w-full h-full object-contain" alt="${cellData.name}" />
                <div id="check-overlay-${coord}" class="absolute inset-0 bg-emerald-500/25 flex items-center justify-center hidden">
                  <span class="text-2xl font-black text-emerald-400 drop-shadow">✔</span>
                </div>
              </div>

              <!-- 卡片線索提示條 (緊貼頭像下方，不遮擋臉部) -->
              <div id="clue-box-${coord}" class="w-full px-0.5 py-0.5 bg-slate-900 border-t border-sky-400/80 flex items-center justify-center text-center flex-shrink-0 ${hasBubble ? '' : 'hidden'}">
                <span class="text-[9px] font-black text-sky-300 leading-tight truncate">${cellData.clue || ''}</span>
              </div>

              <!-- 卡片底部名字標籤 -->
              <div class="w-full text-center text-[9px] font-black bg-slate-800 text-slate-100 py-0.5 truncate leading-none flex-shrink-0" id="name-${coord}">
                ${cellData.name}
              </div>
            `;
          }

          gridBoard.appendChild(cellEl);
        });
      });
    }

    function updateLivesUI() {
      const remainingLives = Math.max(0, 3 - mistakes);
      let hearts = '';
      for (let i = 0; i < 3; i++) {
        hearts += (i < remainingLives) ? '❤️' : '🖤';
      }
      document.getElementById('livesDisplay').innerText = hearts;
    }

    function onCardClicked(coord) {
      const cellData = GAME_LEVELS[currentLevelIndex].gridCells[coord];
      if (!cellData || cellData.disabled) return;
      
      if (displayedClues[coord] && cellData.clue) {
        document.getElementById('hintSpeaker').innerText = `【${coord}號】${cellData.name} 的公開證詞：`;
        document.getElementById('hintQuote').innerText = cellData.clue;
      }

      if (!revealedStatus[coord]) {
        activeSelectingCoord = coord;
        document.getElementById('actionModalAvatar').innerHTML = `
          <img src="${cellData.fileBase}.PNG" onerror="handleImgError(this, '${cellData.fileBase}')" class="w-full h-full object-contain" alt="${cellData.name}" />
        `;
        document.getElementById('actionModalName').innerText = `${coord} 課桌 · ${cellData.name}`;
        
        const preview = (displayedClues[coord] && cellData.clue) 
          ? `該同學發言：「${cellData.clue}」` 
          : '該同學尚未公開發言，請根據其他人的線索推導其身份！';
        document.getElementById('actionModalCluePreview').innerText = preview;

        document.getElementById('actionModal').classList.remove('hidden');
        SoundFx.click();
      }
    }

    function closeActionModal() {
      document.getElementById('actionModal').classList.add('hidden');
      activeSelectingCoord = null;
    }

    function chooseIdentity(chosenType) {
      if (!activeSelectingCoord) return;
      const coord = activeSelectingCoord;
      const cellData = GAME_LEVELS[currentLevelIndex].gridCells[coord];
      closeActionModal();

      const isActuallyWolf = cellData.isWolf;
      const isGuessCorrect = (chosenType === 'wolf' && isActuallyWolf) || (chosenType === 'good' && !isActuallyWolf);

      if (isGuessCorrect) {
        if (isActuallyWolf) {
          revealedStatus[coord] = 'wolf';
          SoundFx.wolfCaught();
          const cardEl = document.getElementById(`card-${coord}`);
          cardEl.className = "char-card revealed-wolf rounded-lg flex flex-col justify-between items-center relative shadow-md overflow-hidden border border-rose-600";
          
          document.getElementById(`avatar-${coord}`).innerHTML = `
            <div class="relative w-full h-full flex items-center justify-center bg-rose-950/40">
              <img src="${cellData.fileBase}.PNG" onerror="handleImgError(this, '${cellData.fileBase}')" class="w-full h-full object-contain grayscale contrast-150 brightness-50" />
              <span class="absolute inset-0 flex items-center justify-center text-2xl animate-pulse">🐺</span>
            </div>
          `;
          document.getElementById(`name-${coord}`).innerText = "🐺 狼人";
          document.getElementById(`name-${coord}`).className = "w-full text-center text-[9px] font-black bg-rose-800 text-white py-0.5 leading-none";
          
          const clueBox = document.getElementById(`clue-box-${coord}`);
          if (clueBox) clueBox.classList.add('hidden');

          document.getElementById('hintSpeaker').innerText = `【${coord}號】真面目暴露！`;
          document.getElementById('hintQuote').innerText = `狼爪現形！狼人同學被當場抓獲！`;
        } else {
          revealedStatus[coord] = 'good';
          displayedClues[coord] = true;
          SoundFx.goodReveal();

          const cardEl = document.getElementById(`card-${coord}`);
          cardEl.className = "char-card revealed-good rounded-lg flex flex-col justify-between items-center relative shadow-md overflow-hidden border border-emerald-500";
          
          const checkOverlay = document.getElementById(`check-overlay-${coord}`);
          if (checkOverlay) checkOverlay.classList.remove('hidden');

          const clueBox = document.getElementById(`clue-box-${coord}`);
          if (clueBox && cellData.clue) {
            clueBox.innerHTML = `<span class="text-[9px] font-black text-emerald-300 leading-tight truncate">${cellData.clue}</span>`;
            clueBox.classList.remove('hidden');
          }

          document.getElementById('hintSpeaker').innerText = `【${coord}號】${cellData.name} 提供新線索：`;
          document.getElementById('hintQuote').innerText = cellData.clue || '這名同學證實了自己的清白！';
        }

        checkVictoryCondition();
      } else {
        mistakes++;
        SoundFx.wrong();
        updateLivesUI();

        const board = document.getElementById('mainBoard');
        board.classList.add('shake-anim');
        setTimeout(() => board.classList.remove('shake-anim'), 400);

        const errorMsg = (chosenType === 'wolf') 
          ? `冤枉好人！${coord}號是無辜同學！` 
          : `判斷失誤！${coord}號其實是潛伏的狼人！`;

        document.getElementById('hintSpeaker').innerText = `⚠️ 教室紀律處分 (${mistakes}/3)`;
        document.getElementById('hintQuote').innerText = errorMsg;

        if (mistakes >= 3) {
          triggerDefeat();
        }
      }
    }

    function checkVictoryCondition() {
      const lvl = GAME_LEVELS[currentLevelIndex];
      const validTotal = lvl.totalValid;
      const clearedNow = Object.keys(revealedStatus).length;
      document.getElementById('clearedCount').innerText = clearedNow;

      let remainingWolves = lvl.wolfCount;
      Object.keys(revealedStatus).forEach(c => {
        if (revealedStatus[c] === 'wolf') remainingWolves--;
      });
      document.getElementById('wolvesRemaining').innerText = Math.max(0, remainingWolves);

      if (clearedNow >= validTotal) {
        triggerVictory();
      }
    }

    function triggerVictory() {
      SoundFx.win();
      saveClearedLevel(GAME_LEVELS[currentLevelIndex].levelId);
      
      const modal = document.getElementById('resultModal');
      const box = document.getElementById('resultBox');
      const emoji = document.getElementById('resultEmoji');
      const title = document.getElementById('resultTitle');
      const desc = document.getElementById('resultDesc');
      const btn = document.getElementById('resultBtn');

      box.className = "bg-slate-900 border-4 border-sky-400 w-full max-w-xs rounded-2xl p-4 text-center shadow-2xl";
      emoji.innerText = "🏆";
      title.innerText = "班級破案！全員查清！";
      title.className = "text-lg font-black text-sky-400 comic-font mb-1";
      desc.innerText = `太強了！混在教室裡的 ${GAME_LEVELS[currentLevelIndex].wolfCount} 隻狼人全數被你揪出！`;
      btn.innerText = "下一節課（下一案）➔";
      btn.className = "w-full py-2 bg-gradient-to-r from-sky-400 to-indigo-500 text-slate-950 font-black rounded-xl text-sm comic-font shadow-md";

      modal.classList.remove('hidden');
    }

    function triggerDefeat() {
      SoundFx.lose();
      const modal = document.getElementById('resultModal');
      const box = document.getElementById('resultBox');
      const emoji = document.getElementById('resultEmoji');
      const title = document.getElementById('resultTitle');
      const desc = document.getElementById('resultDesc');
      const btn = document.getElementById('resultBtn');

      box.className = "bg-slate-900 border-4 border-rose-500 w-full max-w-xs rounded-2xl p-4 text-center shadow-2xl";
      emoji.innerText = "💔";
      title.innerText = "放學危機！三次失誤！";
      title.className = "text-xl font-black text-rose-500 comic-font mb-1";
      desc.innerText = "失誤累積達到 3 次！狼群趁亂佔領了教室，請重新推導！";
      btn.innerText = "重考本案 🔄";
      btn.className = "w-full py-2.5 bg-gradient-to-r from-rose-500 to-red-600 text-white font-black rounded-xl text-sm comic-font shadow-md";

      modal.classList.remove('hidden');
    }

    function onResultBtnClick() {
      document.getElementById('resultModal').classList.add('hidden');
      if (mistakes >= 3) {
        initLevel();
      } else {
        if (currentLevelIndex < GAME_LEVELS.length - 1) {
          currentLevelIndex++;
          initLevel();
        } else {
          alert("神探畢業！全數 50 關校園推理迷案全數偵破！");
        }
      }
    }

    function toggleLevelModal() {
      const modal = document.getElementById('levelModal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        renderLevelSelector();
      }
    }

    function renderLevelSelector() {
      const container = document.getElementById('levelGridContainer');
      container.innerHTML = '';
      const cleared = getClearedLevels();

      for (let i = 1; i <= 50; i++) {
        const btn = document.createElement('button');
        const isCurrent = (i - 1) === currentLevelIndex;
        const isDone = cleared.includes(i);
        const lvlData = GAME_LEVELS[i - 1];

        btn.className = `p-1.5 rounded-lg font-bold font-mono text-xs flex flex-col items-center justify-center border ${
          isCurrent 
            ? 'bg-amber-400 text-slate-950 border-amber-300' 
            : isDone 
              ? 'bg-emerald-800/80 text-emerald-200 border-emerald-500' 
              : `bg-slate-800/90 ${lvlData.diffColor}`
        }`;
        btn.innerHTML = `<span>${i}</span><span class="text-[9px] opacity-75">${lvlData.wolfCount}🐺</span><span>${isDone ? '⭐' : ''}</span>`;
        btn.onclick = () => {
          currentLevelIndex = i - 1;
          initLevel();
          toggleLevelModal();
        };
        container.appendChild(btn);
      }
    }

    function getClearedLevels() {
      try {
        return JSON.parse(localStorage.getItem('werewolf_revealed_cleared') || '[]');
      } catch(e) { return []; }
    }

    function saveClearedLevel(lvlId) {
      const list = getClearedLevels();
      if (!list.includes(lvlId)) {
        list.push(lvlId);
        localStorage.setItem('werewolf_revealed_cleared', JSON.stringify(list));
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initLevel();
    });
  </script>
</body>
</html>
