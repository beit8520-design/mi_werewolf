<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>狼人在身邊 - 邏輯推理大師</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@500;700;900&display=swap');
    
    body {
      font-family: 'Noto Sans TC', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background: #110e1b;
    }

    .comic-font {
      font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
    }

    .board-container {
      background: #9d80d8;
      border: 6px solid #4a3869;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.3);
    }

    .parchment-inner {
      background: #795cb2;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.5);
    }

    .char-card {
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      background: #d8b8ff;
      border: 3px solid #5a3d8a;
    }
    .char-card:active {
      transform: scale(0.96);
    }

    .revealed-good {
      background: #86efac !important;
      border-color: #16a34a !important;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.75);
    }

    .revealed-wolf {
      background: #fca5a5 !important;
      border-color: #dc2626 !important;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.75);
    }

    .bubble-tag {
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid #fbbf24;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      animation: popIn 0.2s ease-out;
    }
    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-anim {
      animation: shake 0.35s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 text-white">

  <!-- 頂部資訊列 -->
  <header class="w-full max-w-md flex items-center justify-between px-2 py-1 mb-1">
    <button onclick="toggleLevelModal()" class="flex items-center gap-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-3 py-1 rounded-xl text-xs shadow-md border-2 border-amber-300">
      <span>📖 案卷</span>
      <span id="caseNavText">第 1/50 案</span>
    </button>
    <div class="flex items-center gap-2">
      <div class="flex items-center gap-1 bg-purple-950/80 px-2.5 py-1 rounded-xl border border-purple-400/40 text-xs shadow">
        <span class="text-sm">❤️</span>
        <span id="livesDisplay" class="font-black text-rose-400 tracking-wider">❤️❤️❤️</span>
      </div>
      <button onclick="toggleAudio()" id="audioBtn" class="bg-purple-900/60 p-1.5 rounded-xl text-sm border border-purple-500/30">🔊</button>
    </div>
  </header>

  <!-- 遊戲主盤面 -->
  <main id="mainBoard" class="w-full max-w-md board-container rounded-3xl p-2 sm:p-3.5 flex flex-col items-center relative flex-1">
    
    <!-- 頂部計數面板 -->
    <div class="w-full flex items-center justify-between bg-purple-950/70 rounded-2xl p-2 border-2 border-purple-400/40 mb-2">
      <div class="flex items-center gap-2 bg-slate-900/80 px-2.5 py-1 rounded-xl border border-slate-700">
        <span class="text-lg">🐺</span>
        <span id="wolvesRemaining" class="text-rose-400 font-black font-mono text-base">2</span>
        <span class="text-[10px] text-slate-300 font-bold">隻待揪出</span>
      </div>

      <div class="flex items-center gap-1 text-xs bg-slate-900/80 px-2.5 py-1 rounded-xl border border-slate-700 text-slate-300">
        <span>已查驗：</span>
        <span id="clearedCount" class="font-mono text-amber-300 font-black">0</span>
        <span id="totalCount">/ 18</span>
      </div>

      <div class="flex items-center gap-1 font-black text-amber-300 comic-font text-sm">
        <span class="w-3 h-3 bg-amber-400 rounded-sm inline-block"></span>
        <span id="boardCaseIndicator">1/50</span>
      </div>
    </div>

    <!-- 棋盤 4x5 (A1 ~ D5) -->
    <div class="w-full parchment-inner rounded-2xl p-1.5 sm:p-2.5 border-2 border-purple-900/60 relative flex-1 flex flex-col justify-center">
      <div id="gridBoard" class="grid grid-cols-4 gap-1.5 sm:gap-2 w-full aspect-[4/5]">
      </div>
    </div>

    <!-- 即時發言提示窗 -->
    <div id="selectedHintBox" class="w-full bg-slate-950/90 border-2 border-amber-500/60 rounded-xl p-2.5 mt-2 text-xs flex items-center gap-2">
      <span class="text-xl flex-shrink-0">💬</span>
      <div class="flex-1 overflow-hidden">
        <div id="hintSpeaker" class="font-bold text-amber-400 text-[11px]">邏輯案件線索簿</div>
        <div id="hintQuote" class="text-slate-200 text-xs">點選盤面帶有 💬 氣泡的角色，交叉比對性別、距離與視角線索！</div>
      </div>
    </div>
  </main>

  <!-- 點擊卡牌查驗選擇彈窗 -->
  <div id="actionModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-purple-950 border-4 border-amber-400 w-full max-w-xs rounded-3xl p-5 text-center shadow-2xl relative">
      <div class="w-16 h-16 mx-auto rounded-full bg-purple-900/60 border-2 border-purple-400/50 p-1 mb-2 overflow-hidden" id="actionModalAvatar">
      </div>
      <h3 class="text-lg font-black text-amber-300 comic-font mb-0.5" id="actionModalName">選擇身份</h3>
      <p class="text-[11px] text-amber-200/90 mb-3 bg-purple-900/60 p-2 rounded-xl border border-purple-400/30" id="actionModalCluePreview"></p>

      <div class="grid grid-cols-2 gap-3 mb-2">
        <button onclick="chooseIdentity('good')" class="py-3 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-black rounded-2xl border-2 border-emerald-300 shadow flex flex-col items-center gap-0.5">
          <span class="text-2xl">👤</span>
          <span class="text-xs">這是好人</span>
        </button>
        <button onclick="chooseIdentity('wolf')" class="py-3 bg-rose-600 hover:bg-rose-500 active:scale-95 text-white font-black rounded-2xl border-2 border-rose-300 shadow flex flex-col items-center gap-0.5">
          <span class="text-2xl">🐺</span>
          <span class="text-xs">這是狼人</span>
        </button>
      </div>

      <button onclick="closeActionModal()" class="w-full py-2 bg-slate-800 text-slate-400 hover:text-white font-bold text-xs rounded-xl mt-1">
        取消
      </button>
    </div>
  </div>

  <!-- 關卡選單 Modal -->
  <div id="levelModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div class="bg-purple-950 border-2 border-purple-400 w-full max-w-sm rounded-3xl p-4 shadow-2xl flex flex-col max-h-[80vh]">
      <div class="flex items-center justify-between pb-2 border-b border-purple-800">
        <h3 class="font-black text-amber-300 text-base comic-font">案卷目錄 (共 50 關)</h3>
        <button onclick="toggleLevelModal()" class="text-white font-mono text-xl">✕</button>
      </div>
      <div class="grid grid-cols-5 gap-2 overflow-y-auto py-3 my-1" id="levelGridContainer">
      </div>
    </div>
  </div>

  <!-- 勝負結果彈窗 -->
  <div id="resultModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div id="resultBox" class="bg-slate-900 border-4 w-full max-w-xs rounded-3xl p-5 text-center shadow-2xl">
      <div id="resultEmoji" class="text-5xl mb-2">🎉</div>
      <h3 id="resultTitle" class="text-xl font-black comic-font mb-1">推敲成功！</h3>
      <p id="resultDesc" class="text-xs text-slate-300 mb-4 leading-relaxed">真相大白，狼人無所遁形！</p>
      
      <button id="resultBtn" onclick="onResultBtnClick()" class="w-full py-2.5 bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 font-black rounded-xl text-sm comic-font shadow-md">
        前往下一案 ➔
      </button>
    </div>
  </div>

  <script>
    /* =====================================================================
       1. 角色 SVG 頭像庫
       ===================================================================== */
    const AVATARS = {
      girl1: `<svg viewBox="0 0 80 80" class="w-full h-full"><circle cx="40" cy="40" r="38" fill="#4c1d95"/><circle cx="40" cy="38" r="16" fill="#fed7aa"/><path d="M22,32 Q40,12 58,32 Q62,55 54,58 Q40,46 26,58 Z" fill="#2e1065"/><circle cx="35" cy="38" r="2.5" fill="#1e1b4b"/><circle cx="45" cy="38" r="2.5" fill="#1e1b4b"/><path d="M37,45 Q40,48 43,45" stroke="#ef4444" stroke-width="1.5" fill="none"/></svg>`,
      girl2: `<svg viewBox="0 0 80 80" class="w-full h-full"><circle cx="40" cy="40" r="38" fill="#831843"/><circle cx="40" cy="40" r="15" fill="#fde047" opacity="0.9"/><path d="M20,30 Q40,14 60,30 Q65,60 55,60 Q40,48 25,60 Z" fill="#500724"/><circle cx="24" cy="24" r="7" fill="#500724"/><circle cx="56" cy="24" r="7" fill="#500724"/><circle cx="36" cy="40" r="2" fill="#000"/><circle cx="44" cy="40" r="2" fill="#000"/></svg>`,
      girl3: `<svg viewBox="0 0 80 80" class="w-full h-full"><circle cx="40" cy="40" r="38" fill="#065f46"/><circle cx="40" cy="39" r="16" fill="#fed7aa"/><path d="M24,28 Q40,10 56,28 L58,62 L22,62 Z" fill="#064e3b"/><circle cx="35" cy="39" r="2.5" fill="#000"/><circle cx="45" cy="39" r="2.5" fill="#000"/></svg>`,
      boy1: `<svg viewBox="0 0 80 80" class="w-full h-full"><circle cx="40" cy="40" r="38" fill="#1e293b"/><circle cx="40" cy="38" r="16" fill="#fbcfe8"/><path d="M24,30 Q40,14 56,30 L56,22 Q40,12 24,22 Z" fill="#0f172a"/><circle cx="34" cy="38" r="2.5" fill="#000"/><circle cx="46" cy="38" r="2.5" fill="#000"/><path d="M30,48 L50,48" stroke="#334155" stroke-width="3"/></svg>`,
      boy2: `<svg viewBox="0 0 80 80" class="w-full h-full"><circle cx="40" cy="40" r="38" fill="#78350f"/><circle cx="40" cy="39" r="16" fill="#fed7aa"/><path d="M25,26 Q40,12 55,26 L58,34 L22,34 Z" fill="#451a03"/><path d="M33,48 Q40,54 47,48" fill="#451a03"/><circle cx="35" cy="37" r="2.5" fill="#000"/><circle cx="45" cy="37" r="2.5" fill="#000"/></svg>`,
      boy3: `<svg viewBox="0 0 80 80" class="w-full h-full"><circle cx="40" cy="40" r="38" fill="#1e1b4b"/><circle cx="40" cy="40" r="16" fill="#ffedd5"/><path d="M26,30 Q40,18 54,30 L52,20 Q40,8 28,20 Z" fill="#312e81"/><circle cx="35" cy="40" r="2" fill="#000"/><circle cx="45" cy="40" r="2" fill="#000"/></svg>`,
      wolf: `<svg viewBox="0 0 80 80" class="w-full h-full animate-pulse"><circle cx="40" cy="40" r="38" fill="#450a0a"/><polygon points="20,15 28,30 15,32" fill="#1c1917"/><polygon points="60,15 52,30 65,32" fill="#1c1917"/><circle cx="40" cy="42" r="18" fill="#1c1917"/><polygon points="32,40 38,42 34,44" fill="#ef4444"/><polygon points="48,40 42,42 46,44" fill="#ef4444"/><path d="M34,50 Q40,58 46,50" stroke="#fff" stroke-width="2" fill="none"/></svg>`
    };

    /* =====================================================================
       2. 高階多維度邏輯生成引擎 (50 關情境豐富化)
       ===================================================================== */
    const COLS = ['A', 'B', 'C', 'D'];
    const ROWS = [1, 2, 3, 4, 5];
    const GAME_LEVELS = [];

    (function generateIntelligentLevels() {
      const namesF = ['沐照', '咖喱', '夏天', '小燕子', '沐熙', '琪多多', '小倩', '紫苑'];
      const namesM = ['小馬', '旺健民', '小賴', '沈金冰', '小豬', '大館長', '李逍', '阿強'];

      for (let lvl = 1; lvl <= 50; lvl++) {
        let wolfNum = 2;
        if (lvl <= 12) wolfNum = 2;
        else if (lvl <= 30) wolfNum = 3;
        else wolfNum = 4;

        // 動態更換障礙物
        const disabledPattern = [
          ['A1', 'A4'],
          ['D1', 'C5'],
          ['B1', 'C4'],
          ['A3', 'D3'],
          ['B5', 'C1']
        ];
        const disabledCoords = disabledPattern[(lvl - 1) % disabledPattern.length];

        const validCoords = [];
        COLS.forEach(c => {
          ROWS.forEach(r => {
            const coord = `${c}${r}`;
            if (!disabledCoords.includes(coord)) validCoords.push(coord);
          });
        });

        // 隨機選定狼人坐標
        const wolfCoords = [];
        const shuffled = [...validCoords].sort(() => 0.5 - Math.sin(lvl * 13.7 + Math.random()));
        for (let w = 0; w < wolfNum; w++) {
          wolfCoords.push(shuffled[w]);
        }

        const gridCells = {};
        const goodCoords = [];

        // 預先建置人物基礎屬性
        validCoords.forEach((coord, idx) => {
          const isWolf = wolfCoords.includes(coord);
          if (!isWolf) goodCoords.push(coord);

          const isFemale = (idx % 2 === 0);
          const name = isFemale ? namesF[idx % namesF.length] : namesM[idx % namesM.length];
          const avatarKey = isFemale ? ['girl1', 'girl2', 'girl3'][idx % 3] : ['boy1', 'boy2', 'boy3'][idx % 3];

          gridCells[coord] = {
            coord: coord,
            col: coord[0],
            row: parseInt(coord[1]),
            name: name,
            isFemale: isFemale,
            isWolf: isWolf,
            avatarKey: avatarKey,
            disabled: false,
            clue: ""
          };
        });

        // 為每位好人賦予深度多樣的「情境邏輯線索」
        goodCoords.forEach((coord, gIdx) => {
          const cell = gridCells[coord];
          const c = cell.col;
          const r = cell.row;
          const cIdx = COLS.indexOf(c);

          // 計算客觀數據
          const rowWolves = wolfCoords.filter(w => w[1] == r).length;
          const colWolves = wolfCoords.filter(w => w[0] == c).length;
          
          // 計算女性狼人與男性狼人
          const femaleWolvesInCol = wolfCoords.filter(w => gridCells[w] && gridCells[w].col === c && gridCells[w].isFemale).length;
          const maleWolvesInRow = wolfCoords.filter(w => gridCells[w] && gridCells[w].row === r && !gridCells[w].isFemale).length;

          // 計算步長曼哈頓距離為 1 的狼人 (十字相鄰)
          const neighbors = [
            `${COLS[cIdx - 1]}${r}`, `${COLS[cIdx + 1]}${r}`,
            `${c}${r - 1}`, `${c}${r + 1}`
          ];
          const adjWolves = wolfCoords.filter(w => neighbors.includes(w)).length;

          // 多種好玩且邏輯互斥的題目類型
          const clueTypes = [
            // 題型 1：邊界與安全區推導
            () => {
              if (adjWolves === 0) return `安全警報：我的上下左右十字格內【完全沒有狼人】，全是好人！`;
              return `我聽見周圍呼吸聲，我的相鄰上下左右裡正好潛伏著 ${adjWolves} 隻狼！`;
            },
            // 題型 2：性別特徵過濾
            () => {
              if (femaleWolvesInCol === 0) return `我確認過，【${c} 列】的所有女性角色全部都是無辜好人！`;
              return `目擊線索：【第 ${r} 排】的男性當中，正好藏著 ${maleWolvesInRow} 個壞人！`;
            },
            // 題型 3：視角射線與定向直擊
            () => {
              // 往右邊掃描
              const rightNeighbors = COLS.slice(cIdx + 1).map(nc => `${nc}${r}`);
              const rightWolves = wolfCoords.filter(w => rightNeighbors.includes(w)).length;
              if (rightNeighbors.length > 0) {
                return `我往我的右側望去，同一水平排右方共有 ${rightWolves} 隻狼人。`;
              }
              return `【${c} 列】目前整條縱線上，恰好露出 ${colWolves} 隻狼尾巴！`;
            },
            // 題型 4：互斥/共存推導 (如果 A 那麼 B，或二選一)
            () => {
              const otherGood = goodCoords.find(gc => gc !== coord && gc[0] !== c && gc[1] !== r);
              const oneWolf = wolfCoords[0];
              if (gIdx % 2 === 0 && otherGood) {
                return `調查證明：我和【${otherGood}】昨晚都在會議室，我們兩個都是好人！`;
              } else if (oneWolf) {
                // 指向性二選一
                const candidate = otherGood || validCoords[0];
                return `邏輯互斥：在【${candidate}】與【${oneWolf}】兩人之中，必定恰好只有 1 隻狼人！`;
              }
              return `在第【${r} 排】這條橫線上，總共有 ${rowWolves} 隻狼人作惡！`;
            }
          ];

          // 隨機選一種高階題型
          const selectedGenerator = clueTypes[gIdx % clueTypes.length];
          cell.clue = selectedGenerator();
        });

        // 禁制格加入
        disabledCoords.forEach(dc => {
          gridCells[dc] = { coord:
