<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>狼人在身邊 - 邏輯推理大師</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@500;700;900&display=swap');
    
    body {
      font-family: 'Noto Sans TC', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background: #110e1b;
    }

    .comic-font {
      font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
    }

    .board-container {
      background: #9d80d8;
      border: 6px solid #4a3869;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.3);
    }

    .parchment-inner {
      background: #795cb2;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.5);
    }

    .char-card {
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      background: #d8b8ff;
      border: 3px solid #5a3d8a;
    }
    .char-card:active {
      transform: scale(0.96);
    }

    .revealed-good {
      background: #86efac !important;
      border-color: #16a34a !important;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.75);
    }

    .revealed-wolf {
      background: #fca5a5 !important;
      border-color: #dc2626 !important;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.75);
    }

    .bubble-tag {
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid #fbbf24;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      animation: popIn 0.2s ease-out;
    }
    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-anim {
      animation: shake 0.35s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 text-white">

  <!-- 頂部資訊列 -->
  <header class="w-full max-w-md flex items-center justify-between px-2 py-1 mb-1">
    <button onclick="toggleLevelModal()" class="flex items-center gap-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-3 py-1 rounded-xl text-xs shadow-md border-2 border-amber-300">
      <span>📖 案卷</span>
      <span id="caseNavText">第 1/50 案</span>
    </button>
    <div class="flex items-center gap-2">
      <div class="flex items-center gap-1 bg-purple-950/80 px-2.5 py-1 rounded-xl border border-purple-400/40 text-xs shadow">
        <span class="text-sm">❤️</span>
        <span id="livesDisplay" class="font-black text-rose-400 tracking-wider">❤️❤️❤️</span>
