<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>狼人在身邊 - 查驗推理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@500;700;900&display=swap');
    
    body {
      font-family: 'Noto Sans TC', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background: #110e1b;
    }

    .comic-font {
      font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
    }

    .board-container {
      background: #9d80d8;
      border: 6px solid #4a3869;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.3);
    }

    .parchment-inner {
      background: #795cb2;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.5);
    }

    .char-card {
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      background: #d8b8ff;
      border: 3px solid #5a3d8a;
    }
    .char-card:active {
      transform: scale(0.96);
    }

    .revealed-good {
      background: #86efac !important;
      border-color: #16a34a !important;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.75);
    }

    .revealed-wolf {
      background: #fca5a5 !important;
      border-color: #dc2626 !important;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.75);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-anim {
      animation: shake 0.35s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 text-white">

  <!-- 頂部資訊列 -->
  <header class="w-full max-w-md flex items-center justify-between px-2 py-1 mb-1">
    <button onclick="toggleLevelModal()" class="flex items-center gap-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-3 py-1 rounded-xl text-xs shadow-md border-2 border-amber-300">
      <span>📖 案卷</span>
      <span id="caseNavText">第 1/50 案</span>
    </button>
    <div class="flex items-center gap-2">
      <!-- 錯誤機會心心 (3 次機會) -->
      <div class="flex items-center gap-1 bg-purple-950/80 px-2.5 py-1 rounded-xl border border-purple-400/40 text-xs shadow">
        <span class="text-sm">❤️</span>
        <span id="livesDisplay" class="font-black text-rose-400 tracking-wider">❤️❤️❤️</span>
      </div>
      <button onclick="toggleAudio()" id="audioBtn" class="bg-purple-900/60 p-1.5 rounded-xl text-sm border border-purple-500/30">🔊</button>
    </div>
  </header>

  <!-- 遊戲主盤面 -->
  <main id="mainBoard" class="w-full max-w-md board-container rounded-3xl p-2 sm:p-3.5 flex flex-col items-center relative flex-1">
    
    <!-- 頂部計數面板 -->
    <div class="w-full flex items-center justify-between bg-purple-950/70 rounded-2xl p-2 border-2 border-purple-400/40 mb-2">
      <div class="flex items-center gap-2 bg-slate-900/80 px-2.5 py-1 rounded-xl border border-slate-700">
        <span class="text-lg">🐺</span>
        <span id="wolvesRemaining" class="text-rose-400 font-black font-mono text-base">2</span>
        <span class="text-[10px] text-slate-300 font-bold">隻待揪出</span>
      </div>

      <div class="flex items-center gap-1 text-xs bg-slate-900/80 px-2.5 py-1 rounded-xl border border-slate-700 text-slate-300">
        <span>已查驗：</span>
        <span id="clearedCount" class="font-mono text-amber-300 font-black">0</span>
        <span id="totalCount">/ 18</span>
      </div>

      <div class="flex items-center gap-1 font-black text-amber-300 comic-font text-sm">
        <span class="w-3 h-3 bg-amber-400 rounded-sm inline-block"></span>
        <span id="boardCaseIndicator">1/50</span>
      </div>
    </div>

    <!-- 棋盤 4x5 (A1 ~ D5) -->
    <div class="w-full parchment-inner rounded-2xl p-1.5 sm:p-2.5 border-2 border-purple-900/60 relative flex-1 flex flex-col justify-center">
      <div id="gridBoard" class="grid grid-cols-4 gap-1.5 sm:gap-2 w-full aspect-[4/5]">
      </div>
    </div>

    <!-- 即時發言提示窗 -->
    <div id="selectedHintBox" class="w-full bg-slate-950/90 border-2 border-amber-500/60 rounded-xl p-2 mt-2 text-xs flex items-center gap-2">
      <span class="text-xl flex-shrink-0">📜</span>
      <div class="flex-1 overflow-hidden">
        <div id="hintSpeaker" class="font-bold text-amber-400 text-[11px]">線索記錄板</div>
        <div id="hintQuote" class="text-slate-200 text-xs truncate">點擊任意未查驗卡牌，選擇指認【好人】或【狼人】！</div>
      </div>
    </div>
  </main>

  <!-- 點擊卡牌查驗選擇彈窗 (好人 / 狼人) -->
  <div id="actionModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-purple-950 border-4 border-amber-400 w-full max-w-xs rounded-3xl p-5 text-center shadow-2xl relative">
      <div class="w-16 h-16 mx-auto rounded-full bg-purple-900/60 border-2 border-purple-400/50 p-1 mb-2 overflow-hidden" id="actionModalAvatar">
      </div>
      <h3 class="text-lg font-black text-amber-300 comic-font mb-1" id="actionModalName">選擇身份</h3>
      <p class="text-xs text-purple-200 mb-4">請根據現有線索，指認此角色的真實身份：</p>

      <div class="grid grid-cols-2 gap-3 mb-2">
        <button onclick="chooseIdentity('good')" class="py-3 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-black rounded-2xl border-2 border-emerald-300 shadow flex flex-col items-center gap-0.5">
          <span class="text-2xl">👤</span>
          <span class="text-xs">這是好人</span>
        </button>
        <button onclick="chooseIdentity('wolf')" class="py-3 bg-rose-600 hover:bg-rose-500 active:scale-95 text-white font-black rounded-2xl border-2 border-rose-300 shadow flex flex-col items-center gap-0.5">
          <span class="text-2xl">🐺</span>
          <span class="text-xs">這是狼人</span>
        </button>
      </div>

      <button onclick="closeActionModal()" class="w-full py-2 bg-slate-800 text-slate-400 hover:text-white font-bold text-xs rounded-xl mt-1">
        取消
      </button>
    </div>
  </div>

  <!-- 關卡選單 Modal -->
  <div id="levelModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div class="bg-purple-950 border-2 border-purple-400 w-full max-w-sm rounded-3xl p-4 shadow-2xl flex flex-col max-h-[80vh]">
      <div class="flex items-center justify-between pb-2 border-b border-purple-800">
        <h3 class="font-black text-amber-300 text-base comic-font">案卷目錄 (共 50 關)</h3>
        <button onclick="toggleLevelModal()" class="text-white font-mono text-xl">✕</button>
      </div>
      <div class="grid grid-cols-5 gap-2 overflow-y-auto py-3 my-1" id="levelGridContainer">
      </div>
    </div>
  </div>

  <!-- 勝負結果彈窗 -->
  <div id="resultModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div id="resultBox" class="bg-slate-900 border-4 w-full max-w-xs rounded-3xl p-5 text-center shadow-2xl">
      <div id="resultEmoji" class="text-5xl mb-2">🎉</div>
      <h3 id="resultTitle" class="text-xl font-black comic-font mb-1">推敲成功！</h3>
      <p id="resultDesc" class="text-xs text-slate-300 mb-4 leading-relaxed">真相大白，狼人無所遁形！</p>
      
      <button id="resultBtn" onclick="onResultBtnClick()" class="w-full py-2.5 bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 font-black rounded-xl text-sm comic-font shadow-md">
        前往下一案 ➔
      </button>
    </div>
  </div>

  <script>
    /* =====================================================================
       1. 角色 SVG 頭像庫
       ===================================================================== */
    const AVATARS = {
      girl1: `<svg viewBox="0 0 80 80" class="w-full h-full"><circle cx="40" cy="40" r="38" fill="#4c1d95"/><circle cx="40" cy="38" r="16" fill="#fed7aa"/><path d="M22,32 Q40,12 58,32 Q62,55 54,58 Q40,46 26,58 Z" fill="#2e1065"/><circle cx="35" cy="38" r="2.5" fill="#1e1b4b"/><circle cx="45" cy="38" r="2.5" fill="#1e1b4b"/><path d="M37,45 Q40,48 43,45" stroke="#ef4444" stroke-width="1.5" fill="none"/></svg>`,
      girl2: `<svg viewBox="0 0 80 80" class="w-full h-full"><circle cx="40" cy="40" r="38" fill="#831843"/><circle cx="40" cy="40" r="15" fill="#fde047" opacity="0.9"/><path d="M20,30 Q40,14 60,30 Q65,60 55,60 Q40,48 25,60 Z" fill="#500724"/><circle cx="24" cy="24" r="7" fill="#500724"/><circle cx="56" cy="24" r="7" fill="#500724"/><circle cx="36" cy="40" r="2" fill="#000"/><circle cx="44" cy="40" r="2" fill="#000"/></svg>`,
      girl3: `<svg viewBox="0 0 80 80" class="w-full h-full"><circle cx="40" cy="40" r="38" fill="#065f46"/><circle cx="40" cy="39" r="16" fill="#fed7aa"/><path d="M24,28 Q40,10 56,28 L58,62 L22,62 Z" fill="#064e3b"/><circle cx="35" cy="39" r="2.5" fill="#000"/><circle cx="45" cy="39" r="2.5" fill="#000"/></svg>`,
      boy1: `<svg viewBox="0 0 80 80" class="w-full h-full"><circle cx="40" cy="40" r="38" fill="#1e293b"/><circle cx="40" cy="38" r="16" fill="#fbcfe8"/><path d="M24,30 Q40,14 56,30 L56,22 Q40,12 24,22 Z" fill="#0f172a"/><circle cx="34" cy="38" r="2.5" fill="#000"/><circle cx="46" cy="38" r="2.5" fill="#000"/><path d="M30,48 L50,48" stroke="#334155" stroke-width="3"/></svg>`,
      boy2: `<svg viewBox="0 0 80 80" class="w-full h-full"><circle cx="40" cy="40" r="38" fill="#78350f"/><circle cx="40" cy="39" r="16" fill="#fed7aa"/><path d="M25,26 Q40,12 55,26 L58,34 L22,34 Z" fill="#451a03"/><path d="M33,48 Q40,54 47,48" fill="#451a03"/><circle cx="35" cy="37" r="2.5" fill="#000"/><circle cx="45" cy="37" r="2.5" fill="#000"/></svg>`,
      boy3: `<svg viewBox="0 0 80 80" class="w-full h-full"><circle cx="40" cy="40" r="38" fill="#1e1b4b"/><circle cx="40" cy="40" r="16" fill="#ffedd5"/><path d="M26,30 Q40,18 54,30 L52,20 Q40,8 28,20 Z" fill="#312e81"/><circle cx="35" cy="40" r="2" fill="#000"/><circle cx="45" cy="40" r="2" fill="#000"/></svg>`,
      wolf: `<svg viewBox="0 0 80 80" class="w-full h-full animate-pulse"><circle cx="40" cy="40" r="38" fill="#450a0a"/><polygon points="20,15 28,30 15,32" fill="#1c1917"/><polygon points="60,15 52,30 65,32" fill="#1c1917"/><circle cx="40" cy="42" r="18" fill="#1c1917"/><polygon points="32,40 38,42 34,44" fill="#ef4444"/><polygon points="48,40 42,42 46,44" fill="#ef4444"/><path d="M34,50 Q40,58 46,50" stroke="#fff" stroke-width="2" fill="none"/></svg>`
    };

    /* =====================================================================
       2. 50 關數據構建 (隨機好人幾何線索)
       ===================================================================== */
    const COLS = ['A', 'B', 'C', 'D'];
    const ROWS = [1, 2, 3, 4, 5];
    const GAME_LEVELS = [];

    (function generateLevels() {
      const namesF = ['沐照', '咖喱', '夏天', '小燕子', '沐熙', '琪多多', '小倩', '紫苑'];
      const namesM = ['小馬', '旺健民', '小賴', '沈金冰', '小豬', '大館長', '李逍', '阿強'];

      for (let lvl = 1; lvl <= 50; lvl++) {
        let wolfNum = 2;
        if (lvl <= 10) wolfNum = 2;
        else if (lvl <= 25) wolfNum = 3;
        else wolfNum = 4;

        const disabledCoords = (lvl % 2 === 1) ? ['A1', 'A4'] : ['D1', 'C5'];
        const validCoords = [];
        COLS.forEach(c => {
          ROWS.forEach(r => {
            const coord = `${c}${r}`;
            if (!disabledCoords.includes(coord)) validCoords.push(coord);
          });
        });

        // 隨機選定狼人坐標
        const wolfCoords = [];
        const shuffled = [...validCoords].sort(() => 0.5 - Math.sin(lvl * 7.9 + Math.random()));
        for (let w = 0; w < wolfNum; w++) {
          wolfCoords.push(shuffled[w]);
        }

        const gridCells = {};
        validCoords.forEach((coord, idx) => {
          const isWolf = wolfCoords.includes(coord);
          const col = coord[0];
          const row = parseInt(coord[1]);
          const isFemale = (idx % 2 === 0);
          const name = isFemale ? namesF[idx % namesF.length] : namesM[idx % namesM.length];
          const avatarKey = isFemale ? ['girl1', 'girl2', 'girl3'][idx % 3] : ['boy1', 'boy2', 'boy3'][idx % 3];

          // 好人的真話發言題庫（幾何線索）
          let cluesList = [];
          const rowWolves = wolfCoords.filter(w => w[1] == row).length;
          const colWolves = wolfCoords.filter(w => w[0] == col).length;
          const adjWolves = getAdjacentCount(coord, wolfCoords);

          cluesList.push(`我查探過，【${col} 列】目前藏有 ${colWolves} 隻狼人！`);
          cluesList.push(`在第【${row} 排】這條橫線上，總共有 ${rowWolves} 個壞人！`);
          cluesList.push(`我的上下左右相鄰位置中，正好有 ${adjWolves} 隻狼！`);

          // 隨機選一位清白的好人背書
          const otherGood = validCoords.find(c => !wolfCoords.includes(c) && c !== coord);
          if (otherGood) {
            cluesList.push(`昨晚我和【${otherGood}】在一起，他絕對是好人！`);
          }

          gridCells[coord] = {
            coord: coord,
            name: name,
            isFemale: isFemale,
            isWolf: isWolf,
            avatarKey: avatarKey,
            disabled: false,
            clue: cluesList[Math.floor(Math.random() * cluesList.length)]
          };
        });

        disabledCoords.forEach(dc => {
          gridCells[dc] = { coord: dc, disabled: true };
        });

        GAME_LEVELS.push({
          levelId: lvl,
          wolfCount: wolfNum,
          totalValid: validCoords.length,
          gridCells: gridCells
        });
      }
    })();

    function getAdjacentCount(coord, wolfCoords) {
      const col = coord[0];
      const row = parseInt(coord[1]);
      const cIdx = COLS.indexOf(col);
      const neighbors = [
        `${COLS[cIdx - 1]}${row}`,
        `${COLS[cIdx + 1]}${row}`,
        `${col}${row - 1}`,
        `${col}${row + 1}`
      ];
      return wolfCoords.filter(w => neighbors.includes(w)).length;
    }

    /* =====================================================================
       3. 核心遊戲流程與音效
       ===================================================================== */
    let currentLevelIndex = 0;
    let revealedStatus = {}; // { 'A1': 'good' | 'wolf' }
    let mistakes = 0; // 錯誤次數（滿 3 次失敗）
    let activeSelectingCoord = null;
    let soundEnabled = true;

    const SoundFx = {
      ctx: null,
      beep(freq, duration = 0.1, type = 'sine') {
        if (!soundEnabled) return;
        try {
          if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.value = 0.15;
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      },
      click() { this.beep(440, 0.05, 'square'); },
      goodReveal() { this.beep(587, 0.12, 'triangle'); },
      wolfCaught() { this.beep(220, 0.25, 'sawtooth'); },
      wrong() { this.beep(160, 0.35, 'sawtooth'); },
      win() { [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => this.beep(f, 0.18, 'triangle'), i * 80)); },
      lose() { [320, 260, 200, 140].forEach((f, i) => setTimeout(() => this.beep(f, 0.25, 'sawtooth'), i * 90)); }
    };

    function toggleAudio() {
      soundEnabled = !soundEnabled;
      document.getElementById('audioBtn').innerText = soundEnabled ? '🔊' : '🔇';
    }

    function initLevel() {
      const lvl = GAME_LEVELS[currentLevelIndex];
      revealedStatus = {};
      mistakes = 0;
      updateLivesUI();

      document.getElementById('caseNavText').innerText = `第 ${lvl.levelId}/50 案`;
      document.getElementById('boardCaseIndicator').innerText = `${lvl.levelId}/50`;
      document.getElementById('wolvesRemaining').innerText = lvl.wolfCount;
      document.getElementById('clearedCount').innerText = '0';
      document.getElementById('totalCount').innerText = `/ ${lvl.totalValid}`;
      document.getElementById('hintSpeaker').innerText = "線索記錄板";
      document.getElementById('hintQuote').innerText = "點擊任意未查驗卡牌，選擇指認【好人】或【狼人】！";

      const gridBoard = document.getElementById('gridBoard');
      gridBoard.innerHTML = '';

      ROWS.forEach(r => {
        COLS.forEach(c => {
          const coord = `${c}${r}`;
          const cellData = lvl.gridCells[coord];
          const cellEl = document.createElement('div');

          if (cellData.disabled) {
            cellEl.className = "w-full h-full rounded-xl bg-purple-900/40 border-2 border-purple-800/40 flex items-center justify-center opacity-40";
            cellEl.innerHTML = `<span class="text-2xl text-purple-300">🚫</span>`;
          } else {
            cellEl.id = `card-${coord}`;
            cellEl.className = "char-card rounded-xl p-1 flex flex-col justify-between items-center relative cursor-pointer shadow-md";
            cellEl.onclick = () => openActionModal(coord);

            cellEl.innerHTML = `
              <div class="w-full flex justify-between items-center px-1 text-[9px] font-black text-purple-950">
                <span class="font-mono">${coord}</span>
                <span>${cellData.isFemale ? '♀️' : '♂️'}</span>
              </div>
              <div class="w-9 h-9 sm:w-11 sm:h-11 my-0.5 rounded-full overflow-hidden bg-purple-950/20 p-0.5" id="avatar-${coord}">
                ${AVATARS[cellData.avatarKey]}
              </div>
              <div class="w-full text-center text-[10px] sm:text-[11px] font-black bg-purple-950/30 text-purple-950 rounded py-0.2 truncate" id="name-${coord}">
                ${cellData.name}
              </div>
              <div id="badge-${coord}" class="absolute -top-1.5 -right-1.5 hidden">
                <span class="text-xs">❓</span>
              </div>
            `;
          }

          gridBoard.appendChild(cellEl);
        });
      });
    }

    function updateLivesUI() {
      const remainingLives = 3 - mistakes;
      let hearts = '';
      for (let i = 0; i < 3; i++) {
        hearts += (i < remainingLives) ? '❤️' : '🖤';
      }
      document.getElementById('livesDisplay').innerText = hearts;
    }

    /* =====================================================================
       4. 查驗與身分判斷邏輯
       ===================================================================== */
    function openActionModal(coord) {
      if (revealedStatus[coord]) {
        // 如果已經查驗出來，點擊則是回顧其發言
        const cellData = GAME_LEVELS[currentLevelIndex].gridCells[coord];
        if (!cellData.isWolf) {
          document.getElementById('hintSpeaker').innerText = `【${coord}號】${cellData.name} 的發言回顧：`;
          document.getElementById('hintQuote').innerText = cellData.clue;
        }
        return;
      }

      activeSelectingCoord = coord;
      const cellData = GAME_LEVELS[currentLevelIndex].gridCells[coord];
      document.getElementById('actionModalAvatar').innerHTML = AVATARS[cellData.avatarKey];
      document.getElementById('actionModalName').innerText = `${coord} 座位 · ${cellData.name}`;
      document.getElementById('actionModal').classList.remove('hidden');
      SoundFx.click();
    }

    function closeActionModal() {
      document.getElementById('actionModal').classList.add('hidden');
      activeSelectingCoord = null;
    }

    function chooseIdentity(chosenType) {
      if (!activeSelectingCoord) return;
      const coord = activeSelectingCoord;
      const cellData = GAME_LEVELS[currentLevelIndex].gridCells[coord];
      closeActionModal();

      const isActuallyWolf = cellData.isWolf;
      const isGuessCorrect = (chosenType === 'wolf' && isActuallyWolf) || (chosenType === 'good' && !isActuallyWolf);

      if (isGuessCorrect) {
        // 猜對了！
        if (isActuallyWolf) {
          // 抓到狼人
          revealedStatus[coord] = 'wolf';
          SoundFx.wolfCaught();
          const cardEl = document.getElementById(`card-${coord}`);
          cardEl.className = "char-card revealed-wolf rounded-xl p-1 flex flex-col justify-between items-center relative shadow-md";
          document.getElementById(`avatar-${coord}`).innerHTML = AVATARS.wolf;
          document.getElementById(`name-${coord}`).innerText = "狼人";
          document.getElementById(`name-${coord}`).className = "w-full text-center text-[10px] sm:text-[11px] font-black bg-red-900 text-white rounded py-0.2";
          
          document.getElementById('hintSpeaker').innerText = `【${coord}號】身分揭曉！`;
          document.getElementById('hintQuote').innerText = `狡猾的狼人被你當場抓獲！`;
        } else {
          // 確認好人，發表提示
          revealedStatus[coord] = 'good';
          SoundFx.goodReveal();
          const cardEl = document.getElementById(`card-${coord}`);
          cardEl.className = "char-card revealed-good rounded-xl p-1 flex flex-col justify-between items-center relative shadow-md";
          
          // 好人發言提示
          document.getElementById('hintSpeaker').innerText = `【${coord}號】${cellData.name}（好人）提供線索：`;
          document.getElementById('hintQuote').innerText = cellData.clue;
        }

        checkVictoryCondition();
      } else {
        // 猜錯了！扣生命心心
        mistakes++;
        SoundFx.wrong();
        updateLivesUI();

        // 棋盤震動反饋
        const board = document.getElementById('mainBoard');
        board.classList.add('shake-anim');
        setTimeout(() => board.classList.remove('shake-anim'), 400);

        const errorMsg = (chosenType === 'wolf') 
          ? `判斷失誤！${coord}號是無辜的好人，不能亂扣狼人帽子！` 
          : `判斷失誤！${coord}號其實是潛伏的狼人！`;

        document.getElementById('hintSpeaker').innerText = `⚠️ 查驗錯誤 (${mistakes}/3)`;
        document.getElementById('hintQuote').innerText = errorMsg;

        if (mistakes >= 3) {
          triggerDefeat();
        }
      }
    }

    function checkVictoryCondition() {
      const lvl = GAME_LEVELS[currentLevelIndex];
      const validTotal = lvl.totalValid;
      const clearedNow = Object.keys(revealedStatus).length;
      document.getElementById('clearedCount').innerText = clearedNow;

      // 計算剩餘狼人
      let remainingWolves = lvl.wolfCount;
      Object.keys(revealedStatus).forEach(c => {
        if (revealedStatus[c] === 'wolf') remainingWolves--;
      });
      document.getElementById('wolvesRemaining').innerText = Math.max(0, remainingWolves);

      // 如果全部好人和狼人都被查驗出來
      if (clearedNow >= validTotal) {
        triggerVictory();
      }
    }

    function triggerVictory() {
      SoundFx.win();
      saveClearedLevel(GAME_LEVELS[currentLevelIndex].levelId);
      
      const modal = document.getElementById('resultModal');
      const box = document.getElementById('resultBox');
      const emoji = document.getElementById('resultEmoji');
      const title = document.getElementById('resultTitle');
      const desc = document.getElementById('resultDesc');
      const btn = document.getElementById('resultBtn');

      box.className = "bg-slate-900 border-4 border-emerald-400 w-full max-w-xs rounded-3xl p-5 text-center shadow-2xl";
      emoji.innerText = "🏆";
      title.innerText = "全部查明！推敲大獲全勝！";
      title.className = "text-xl font-black text-emerald-400 comic-font mb-1";
      desc.innerText = "所有的好人皆已安全，潛伏的狼人也全數落網！";
      btn.innerText = "前往下一案 ➔";
      btn.className = "w-full py-2.5 bg-gradient-to-r from-emerald-400 to-teal-500 text-slate-950 font-black rounded-xl text-sm comic-font shadow-md";

      modal.classList.remove('hidden');
    }

    function triggerDefeat() {
      SoundFx.lose();
      const modal = document.getElementById('resultModal');
      const box = document.getElementById('resultBox');
      const emoji = document.getElementById('resultEmoji');
      const title = document.getElementById('resultTitle');
      const desc = document.getElementById('resultDesc');
      const btn = document.getElementById('resultBtn');

      box.className = "bg-slate-900 border-4 border-rose-500 w-full max-w-xs rounded-3xl p-5 text-center shadow-2xl";
      emoji.innerText = "💔";
      title.innerText = "推敲失敗！三次失誤！";
      title.className = "text-xl font-black text-rose-500 comic-font mb-1";
      desc.innerText = "錯誤累積達到 3 次，狼人趁亂逃脫了！請重新整理思緒再次挑戰。";
      btn.innerText = "重新挑戰本案 🔄";
      btn.className = "w-full py-2.5 bg-gradient-to-r from-rose-500 to-red-600 text-white font-black rounded-xl text-sm comic-font shadow-md";

      modal.classList.remove('hidden');
    }

    function onResultBtnClick() {
      document.getElementById('resultModal').classList.add('hidden');
      if (mistakes >= 3) {
        initLevel();
      } else {
        if (currentLevelIndex < GAME_LEVELS.length - 1) {
          currentLevelIndex++;
          initLevel();
        } else {
          alert("恭喜通關！五十宗棋盤迷案全數偵破！");
        }
      }
    }

    /* =====================================================================
       5. 選單與儲存
       ===================================================================== */
    function toggleLevelModal() {
      const modal = document.getElementById('levelModal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        renderLevelSelector();
      }
    }

    function renderLevelSelector() {
      const container = document.getElementById('levelGridContainer');
      container.innerHTML = '';
      const cleared = getClearedLevels();

      for (let i = 1; i <= 50; i++) {
        const btn = document.createElement('button');
        const isCurrent = (i - 1) === currentLevelIndex;
        const isDone = cleared.includes(i);

        btn.className = `p-2 rounded-xl font-bold font-mono text-xs flex flex-col items-center justify-center border ${
          isCurrent 
            ? 'bg-amber-400 text-slate-950 border-amber-300' 
            : isDone 
              ? 'bg-emerald-800/80 text-emerald-200 border-emerald-500' 
              : 'bg-purple-900/60 text-purple-300 border-purple-700'
        }`;
        btn.innerHTML = `<span>${i}</span><span>${isDone ? '⭐' : ''}</span>`;
        btn.onclick = () => {
          currentLevelIndex = i - 1;
          initLevel();
          toggleLevelModal();
        };
        container.appendChild(btn);
      }
    }

    function getClearedLevels() {
      try {
        return JSON.parse(localStorage.getItem('werewolf_revealed_cleared') || '[]');
      } catch(e) { return []; }
    }

    function saveClearedLevel(lvlId) {
      const list = getClearedLevels();
      if (!list.includes(lvlId)) {
        list.push(lvlId);
        localStorage.setItem('werewolf_revealed_cleared', JSON.stringify(list));
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initLevel();
    });
  </script>
</body>
</html>
