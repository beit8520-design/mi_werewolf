<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>狼人在身邊 - 棋盤邏輯推理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@500;700;900&display=swap');
    
    body {
      font-family: 'Noto Sans TC', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background: #110e1b;
    }

    .comic-font {
      font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
    }

    /* 仿手遊木紋羊皮紙主外框 */
    .board-container {
      background: #9d80d8;
      border: 6px solid #4a3869;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.3);
    }

    .parchment-inner {
      background: #795cb2;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.5);
    }

    /* 角色卡牌基本樣式 */
    .char-card {
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      background: #d8b8ff;
      border: 3px solid #5a3d8a;
    }
    .char-card:active {
      transform: scale(0.95);
    }

    /* 標記狀態色彩 */
    .state-good {
      background: #86efac !important;
      border-color: #16a34a !important;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.7);
    }
    .state-wolf {
      background: #fca5a5 !important;
      border-color: #dc2626 !important;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.7);
    }

    /* 氣泡對話框小箭頭 */
    .speech-bubble::after {
      content: '';
      position: absolute;
      top: -6px;
      left: 12px;
      border-width: 0 6px 6px 6px;
      border-style: solid;
      border-color: transparent transparent #1e1b4b transparent;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 text-white">

  <!-- 頂部手遊標題與功能按鈕 -->
  <header class="w-full max-w-md flex items-center justify-between px-2 py-1 mb-1">
    <button onclick="toggleLevelModal()" class="flex items-center gap-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-3 py-1 rounded-xl text-xs shadow-md border-2 border-amber-300">
      <span>📖 案卷</span>
      <span id="caseNavText">第 1/50 案</span>
    </button>
    <div class="flex items-center gap-2">
      <div class="flex items-center gap-1 bg-purple-950/80 px-2 py-1 rounded-lg border border-purple-400/30 text-xs">
        <span>❤️</span>
        <span id="livesText" class="font-bold text-rose-400">3</span>
      </div>
      <button onclick="toggleAudio()" id="audioBtn" class="bg-purple-900/60 p-1 rounded-lg text-sm border border-purple-500/30">🔊</button>
    </div>
  </header>

  <!-- 遊戲主體：直式木質羊皮紙盤面 (完全模仿手遊版面) -->
  <main class="w-full max-w-md board-container rounded-3xl p-2 sm:p-3.5 flex flex-col items-center relative flex-1">
    
    <!-- 頂部儀表板：狼人數量、當前關卡進度與眼睛道具 -->
    <div class="w-full flex items-center justify-between bg-purple-950/70 rounded-2xl p-2 border-2 border-purple-400/40 mb-2">
      <!-- 剩餘狼人數標誌 -->
      <div class="flex items-center gap-2 bg-slate-900/80 px-2.5 py-1 rounded-xl border border-slate-700">
        <span class="text-xl">🐺</span>
        <span id="wolvesNeedFind" class="text-rose-400 font-black font-mono text-base">2</span>
        <span class="text-[10px] text-slate-300 font-bold">隻狼</span>
      </div>

      <!-- 進度指示 -->
      <div class="flex items-center gap-1.5 font-black text-amber-300 comic-font text-sm">
        <span class="w-3 h-3 bg-amber-400 rounded-sm inline-block"></span>
        <span id="boardCaseIndicator">1/50</span>
      </div>

      <!-- 照妖鏡道具 -->
      <button onclick="useEyeTool()" class="flex items-center gap-1 bg-indigo-900/90 hover:bg-indigo-800 text-amber-300 px-2.5 py-1 rounded-xl border border-amber-400/50 shadow text-xs font-black">
        <span class="text-base">👁️</span>
        <span id="eyeCount">1</span>
      </button>
    </div>

    <!-- 棋盤座標指示與 4x5 網格核心 -->
    <div class="w-full parchment-inner rounded-2xl p-1.5 sm:p-2.5 border-2 border-purple-900/60 relative flex-1 flex flex-col justify-center">
      
      <!-- 4x5 網格容器 (A1 ~ D5) -->
      <div id="gridBoard" class="grid grid-cols-4 gap-1.5 sm:gap-2 w-full aspect-[4/5]">
        <!-- 卡牌由 JS 動態生成 -->
      </div>

    </div>

    <!-- 底部當前點選的發言詳情提示（當卡片字太小時可在此放大查看） -->
    <div id="selectedHintBox" class="w-full bg-slate-950/90 border-2 border-amber-500/60 rounded-xl p-2 mt-2 text-xs flex items-center gap-2">
      <span class="text-xl">💬</span>
      <div class="flex-1">
        <div id="hintSpeaker" class="font-bold text-amber-400 text-[11px]">點擊上方任意角色</div>
        <div id="hintQuote" class="text-slate-200 text-xs">查看此人提供的位置線索與供詞</div>
      </div>
    </div>

    <!-- 底部提交審判大按鈕 -->
    <button onclick="verifySubmission()" class="w-full mt-2 py-3 bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 hover:from-amber-400 hover:to-orange-500 text-slate-950 font-black rounded-2xl border-2 border-yellow-200 shadow-lg text-base tracking-widest comic-font flex items-center justify-center gap-2 active:scale-98 transition">
      <span>推敲真相 · 結案指認！</span>
    </button>
  </main>

  <!-- 案件選單 Modal -->
  <div id="levelModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div class="bg-purple-950 border-2 border-purple-400 w-full max-w-sm rounded-3xl p-4 shadow-2xl flex flex-col max-h-[80vh]">
      <div class="flex items-center justify-between pb-2 border-b border-purple-800">
        <h3 class="font-black text-amber-300 text-base comic-font">案卷目錄 (共 50 關)</h3>
        <button onclick="toggleLevelModal()" class="text-white font-mono text-xl">✕</button>
      </div>
      <div class="grid grid-cols-5 gap-2 overflow-y-auto py-3 my-1" id="levelGridContainer">
        <!-- 50 個按鈕由 JS 填充 -->
      </div>
    </div>
  </div>

  <!-- 結果判定彈窗 -->
  <div id="resultModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div id="resultBox" class="bg-slate-900 border-4 border-amber-400 w-full max-w-xs rounded-3xl p-5 text-center shadow-2xl">
      <div id="resultEmoji" class="text-5xl mb-2">🎉</div>
      <h3 id="resultTitle" class="text-xl font-black text-amber-400 comic-font mb-1">推敲成功！</h3>
      <p id="resultDesc" class="text-xs text-slate-300 mb-4 leading-relaxed">真相大白，狼人無所遁形！</p>
      
      <div id="proofNotes" class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800 text-[11px] text-left text-slate-300 mb-4 leading-normal">
        邏輯分析細節
      </div>

      <button id="nextLevelBtn" onclick="goToNextCase()" class="w-full py-2.5 bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 font-black rounded-xl text-sm comic-font shadow-md">
        下一案 ➔
      </button>
      <button id="retryBtn" onclick="closeResultModal()" class="w-full py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs mt-2">
        再次審視
      </button>
    </div>
  </div>

  <script>
    /* =====================================================================
       1. 經典人物頭像庫（SVG 高清矢量繪製：男女多樣角色）
       ===================================================================== */
    const AVATARS = {
      girl1: `<svg viewBox="0 0 80 80" class="w-full h-full"><circle cx="40" cy="40" r="38" fill="#4c1d95"/><circle cx="40" cy="38" r="16" fill="#fed7aa"/><path d="M22,32 Q40,12 58,32 Q62,55 54,58 Q40,46 26,58 Z" fill="#2e1065"/><circle cx="35" cy="38" r="2.5" fill="#1e1b4b"/><circle cx="45" cy="38" r="2.5" fill="#1e1b4b"/><path d="M37,45 Q40,48 43,45" stroke="#ef4444" stroke-width="1.5" fill="none"/></svg>`,
      girl2: `<svg viewBox="0 0 80 80" class="w-full h-full"><circle cx="40" cy="40" r="38" fill="#831843"/><circle cx="40" cy="40" r="15" fill="#fde047" opacity="0.9"/><path d="M20,30 Q40,14 60,30 Q65,60 55,60 Q40,48 25,60 Z" fill="#500724"/><circle cx="24" cy="24" r="7" fill="#500724"/><circle cx="56" cy="24" r="7" fill="#500724"/><circle cx="36" cy="40" r="2" fill="#000"/><circle cx="44" cy="40" r="2" fill="#000"/></svg>`,
      girl3: `<svg viewBox="0 0 80 80" class="w-full h-full"><circle cx="40" cy="40" r="38" fill="#065f46"/><circle cx="40" cy="39" r="16" fill="#fed7aa"/><path d="M24,28 Q40,10 56,28 L58,62 L22,62 Z" fill="#064e3b"/><circle cx="35" cy="39" r="2.5" fill="#000"/><circle cx="45" cy="39" r="2.5" fill="#000"/></svg>`,
      boy1: `<svg viewBox="0 0 80 80" class="w-full h-full"><circle cx="40" cy="40" r="38" fill="#1e293b"/><circle cx="40" cy="38" r="16" fill="#fbcfe8"/><path d="M24,30 Q40,14 56,30 L56,22 Q40,12 24,22 Z" fill="#0f172a"/><circle cx="34" cy="38" r="2.5" fill="#000"/><circle cx="46" cy="38" r="2.5" fill="#000"/><path d="M30,48 L50,48" stroke="#334155" stroke-width="3"/></svg>`,
      boy2: `<svg viewBox="0 0 80 80" class="w-full h-full"><circle cx="40" cy="40" r="38" fill="#78350f"/><circle cx="40" cy="39" r="16" fill="#fed7aa"/><path d="M25,26 Q40,12 55,26 L58,34 L22,34 Z" fill="#451a03"/><path d="M33,48 Q40,54 47,48" fill="#451a03"/><circle cx="35" cy="37" r="2.5" fill="#000"/><circle cx="45" cy="37" r="2.5" fill="#000"/></svg>`,
      boy3: `<svg viewBox="0 0 80 80" class="w-full h-full"><circle cx="40" cy="40" r="38" fill="#1e1b4b"/><circle cx="40" cy="40" r="16" fill="#ffedd5"/><path d="M26,30 Q40,18 54,30 L52,20 Q40,8 28,20 Z" fill="#312e81"/><circle cx="35" cy="40" r="2" fill="#000"/><circle cx="45" cy="40" r="2" fill="#000"/></svg>`,
      wolf: `<svg viewBox="0 0 80 80" class="w-full h-full animate-pulse"><circle cx="40" cy="40" r="38" fill="#450a0a"/><polygon points="20,15 28,30 15,32" fill="#1c1917"/><polygon points="60,15 52,30 65,32" fill="#1c1917"/><circle cx="40" cy="42" r="18" fill="#1c1917"/><polygon points="32,40 38,42 34,44" fill="#ef4444"/><polygon points="48,40 42,42 46,44" fill="#ef4444"/><path d="M34,50 Q40,58 46,50" stroke="#fff" stroke-width="2" fill="none"/></svg>`
    };

    /* =====================================================================
       2. 產生 50 關【幾何座標位置邏輯】數據庫 (全面升級版)
       ===================================================================== */
    const COLS = ['A', 'B', 'C', 'D'];
    const ROWS = [1, 2, 3, 4, 5];
    const GAME_LEVELS = [];

    (function generate50Levels() {
      const namesFemale = ['沐照', '咖喱', '夏天', '小燕子', '沐熙', '琪多多', '小倩', '白雪', '紫苑'];
      const namesMale = ['小馬', '旺健民', '小賴', '沈金冰', '小豬', '大館長', '李逍', '阿強', '老爹'];

      for (let lvl = 1; lvl <= 50; lvl++) {
        // 隨關卡推進增加狼人數與複雜度
        let wolfNum = 2;
        if (lvl <= 10) wolfNum = 2;
        else if (lvl <= 25) wolfNum = 3;
        else if (lvl <= 40) wolfNum = 4;
        else wolfNum = 4;

        // 隨機選定 2 個禁制空格 (🚫)
        const disabledCoords = [];
        if (lvl % 2 === 1) {
          disabledCoords.push('A1', 'A4');
        } else {
          disabledCoords.push('D1', 'C5');
        }

        // 建立所有座標池
        const allCoords = [];
        COLS.forEach(c => {
          ROWS.forEach(r => {
            const coord = `${c}${r}`;
            if (!disabledCoords.includes(coord)) {
              allCoords.push(coord);
            }
          });
        });

        // 決定狼人座標位置
        const wolfCoords = [];
        const seedShift = (lvl * 3) % allCoords.length;
        for (let w = 0; w < wolfNum; w++) {
          const wolfCoord = allCoords[(seedShift + w * 4) % allCoords.length];
          if (!wolfCoords.includes(wolfCoord)) {
            wolfCoords.push(wolfCoord);
          }
        }
        // 若重複補足
        while (wolfCoords.length < wolfNum) {
          const c = allCoords[Math.floor(Math.random() * allCoords.length)];
          if (!wolfCoords.includes(c)) wolfCoords.push(c);
        }

        // 構建每張卡片的坐標、性別、角色、對話邏輯
        const gridCells = {};
        allCoords.forEach((coord, idx) => {
          const isWolf = wolfCoords.includes(coord);
          const col = coord[0];
          const row = parseInt(coord[1]);
          const isFemale = (idx % 2 === 0);
          const name = isFemale 
            ? namesFemale[idx % namesFemale.length] 
            : namesMale[idx % namesMale.length];
          const avatarKey = isFemale 
            ? ['girl1', 'girl2', 'girl3'][idx % 3] 
            : ['boy1', 'boy2', 'boy3'][idx % 3];

          // 產生專屬幾何發言（好人說真話，狼人說假話）
          let quote = "";

          // 計算客觀事實
          const wolvesInSameRow = wolfCoords.filter(wc => wc[1] == row).length;
          const wolvesInSameCol = wolfCoords.filter(wc => wc[0] == col).length;

          if (!isWolf) {
            // 好人：說出真實幾何線索
            if (idx % 4 === 0) {
              quote = `我看到 ${col} 列中正好有 ${wolvesInSameCol} 隻狼人。`;
            } else if (idx % 4 === 1) {
              quote = `第 ${row} 排總共有 ${wolvesInSameRow} 個壞人露出馬腳！`;
            } else if (idx % 4 === 2) {
              const friend = allCoords.find(ac => !wolfCoords.includes(ac) && ac !== coord);
              quote = `${friend} 昨晚和我在一起，他是清白的好人！`;
            } else {
              quote = `我的上下左右相鄰位置裡，藏著 ${getAdjacentWolves(coord, wolfCoords)} 隻狼人。`;
            }
          } else {
            // 狼人：說出虛假撒謊言論（混淆視聽）
            if (idx % 2 === 0) {
              quote = `這條 ${col} 列絕對安全，全都是好人！`;
            } else {
              quote = `我敢發誓第 ${row} 排連一隻狼人都沒有。`;
            }
          }

          gridCells[coord] = {
            coord: coord,
            col: col,
            row: row,
            name: name,
            isFemale: isFemale,
            isWolf: isWolf,
            quote: quote,
            avatarKey: avatarKey,
            disabled: false
          };
        });

        // 加入禁制格
        disabledCoords.forEach(dc => {
          gridCells[dc] = { coord: dc, disabled: true };
        });

        GAME_LEVELS.push({
          levelId: lvl,
          wolfCount: wolfNum,
          gridCells: gridCells,
          proof: `【偵探復盤筆記】：\n比對各列、行與相鄰計數矛盾，真正的狼人座標為：${wolfCoords.join('、')}！他們的言論與好人提供的幾何事實完全衝突。`
        });
      }
    })();

    // 輔助函式：計算相鄰十字狼人數
    function getAdjacentWolves(coord, wolfCoords) {
      const col = coord[0];
      const row = parseInt(coord[1]);
      const cIdx = COLS.indexOf(col);
      const neighbors = [
        `${COLS[cIdx - 1]}${row}`,
        `${COLS[cIdx + 1]}${row}`,
        `${col}${row - 1}`,
        `${col}${row + 1}`
      ];
      return wolfCoords.filter(w => neighbors.includes(w)).length;
    }

    /* =====================================================================
       3. 遊戲進行狀態
       ===================================================================== */
    let currentLevelIndex = 0;
    let cardMarks = {}; // { 'A1': 'unknown' | 'good' | 'wolf' }
    let eyeRemaining = 1;
    let lives = 3;
    let soundEnabled = true;

    // 音效引擎
    const SoundFx = {
      ctx: null,
      beep(freq, duration = 0.1, type = 'sine') {
        if (!soundEnabled) return;
        try {
          if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.value = 0.15;
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      },
      click() { this.beep(400, 0.05, 'square'); },
      stampGood() { this.beep(600, 0.08, 'triangle'); },
      stampWolf() { this.beep(220, 0.12, 'sawtooth'); },
      win() { [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => this.beep(f, 0.18, 'triangle'), i * 80)); },
      lose() { [320, 280, 240, 180].forEach((f, i) => setTimeout(() => this.beep(f, 0.2, 'sawtooth'), i * 90)); }
    };

    function toggleAudio() {
      soundEnabled = !soundEnabled;
      document.getElementById('audioBtn').innerText = soundEnabled ? '🔊' : '🔇';
    }

    /* =====================================================================
       4. 棋盤渲染與互動切換
       ===================================================================== */
    function loadCurrentLevel() {
      const lvl = GAME_LEVELS[currentLevelIndex];
      cardMarks = {};
      eyeRemaining = 1;
      document.getElementById('eyeCount').innerText = eyeRemaining;
      document.getElementById('caseNavText').innerText = `第 ${lvl.levelId}/50 案`;
      document.getElementById('boardCaseIndicator').innerText = `${lvl.levelId}/50`;
      document.getElementById('wolvesNeedFind').innerText = lvl.wolfCount;
      document.getElementById('livesText').innerText = lives;

      // 清空對話預覽
      document.getElementById('hintSpeaker').innerText = "點擊任意角色卡牌";
      document.getElementById('hintQuote').innerText = "查看此人提供的位置線索與具體供詞";

      const gridBoard = document.getElementById('gridBoard');
      gridBoard.innerHTML = '';

      // 依序由 Row 1~5, Col A~D 排列 20 個格子
      ROWS.forEach(r => {
        COLS.forEach(c => {
          const coord = `${c}${r}`;
          const cellData = lvl.gridCells[coord];
          const cellEl = document.createElement('div');

          if (cellData.disabled) {
            // 禁制空格 🚫
            cellEl.className = "w-full h-full rounded-xl bg-purple-900/40 border-2 border-purple-800/40 flex items-center justify-center opacity-40";
            cellEl.innerHTML = `<span class="text-2xl text-purple-300">🚫</span>`;
          } else {
            // 正常角色卡牌
            cardMarks[coord] = 'unknown';
            cellEl.id = `card-${coord}`;
            cellEl.className = "char-card rounded-xl p-1 flex flex-col justify-between items-center relative cursor-pointer shadow-md";
            cellEl.onclick = () => onCardClicked(coord);

            cellEl.innerHTML = `
              <!-- 頂部：座標 (如 A2) 與性別標誌 -->
              <div class="w-full flex justify-between items-center px-1 text-[9px] font-black text-purple-950">
                <span class="font-mono">${coord}</span>
                <span>${cellData.isFemale ? '♀️' : '♂️'}</span>
              </div>

              <!-- 角色大立繪 (SVG) -->
              <div class="w-9 h-9 sm:w-11 sm:h-11 my-0.5 rounded-full overflow-hidden bg-purple-950/20 p-0.5" id="avatar-${coord}">
                ${AVATARS[cellData.avatarKey]}
              </div>

              <!-- 名字 -->
              <div class="w-full text-center text-[10px] sm:text-[11px] font-black bg-purple-950/30 text-purple-950 rounded py-0.2 truncate">
                ${cellData.name}
              </div>

              <!-- 懸浮對話短提示 (仿截圖泡泡) -->
              <div class="absolute -bottom-1 -right-1 bg-indigo-950 border border-amber-300 text-amber-200 text-[8px] px-1 rounded-full font-mono scale-90">
                💬
              </div>

              <!-- 標記圖章 (好人/狼人/問號) -->
              <div id="mark-${coord}" class="absolute inset-0 rounded-xl flex items-center justify-center pointer-events-none opacity-0 transition-opacity">
                <!-- JS 切換狀態 -->
              </div>
            `;
          }

          gridBoard.appendChild(cellEl);
        });
      });
    }

    // 點擊卡片循環切換狀態： 未知 ➔ 好人 ➔ 狼人 ➔ 未知
    function onCardClicked(coord) {
      const cellData = GAME_LEVELS[currentLevelIndex].gridCells[coord];
      if (!cellData || cellData.disabled) return;

      // 更新下方提示文字
      document.getElementById('hintSpeaker').innerText = `【${coord}號】${cellData.name} 的發言供詞：`;
      document.getElementById('hintQuote').innerText = `「${cellData.quote}」`;

      // 切換標記狀態
      const current = cardMarks[coord];
      const cardEl = document.getElementById(`card-${coord}`);
      const markEl = document.getElementById(`mark-${coord}`);

      if (current === 'unknown') {
        cardMarks[coord] = 'good';
        SoundFx.stampGood();
        cardEl.className = "char-card state-good rounded-xl p-1 flex flex-col justify-between items-center relative cursor-pointer shadow-md";
        markEl.innerHTML = `<span class="bg-emerald-600 text-white font-black text-[10px] px-1.5 py-0.5 rounded-full border border-white shadow">好人</span>`;
        markEl.style.opacity = '1';
      } else if (current === 'good') {
        cardMarks[coord] = 'wolf';
        SoundFx.stampWolf();
        cardEl.className = "char-card state-wolf rounded-xl p-1 flex flex-col justify-between items-center relative cursor-pointer shadow-md";
        markEl.innerHTML = `<span class="bg-rose-600 text-white font-black text-[10px] px-1.5 py-0.5 rounded-full border border-white shadow animate-pulse">🐺 狼</span>`;
        markEl.style.opacity = '1';
      } else {
        cardMarks[coord] = 'unknown';
        SoundFx.click();
        cardEl.className = "char-card rounded-xl p-1 flex flex-col justify-between items-center relative cursor-pointer shadow-md";
        markEl.style.opacity = '0';
      }
    }

    /* =====================================================================
       5. 照妖鏡道具 (直接照出一名角色的真偽)
       ===================================================================== */
    function useEyeTool() {
      if (eyeRemaining <= 0) {
        alert("本關照妖鏡已用盡！請依據供詞與位置邏輯進行推理。");
        return;
      }
      const lvl = GAME_LEVELS[currentLevelIndex];
      // 找出還沒標出或隨機一隻狼人
      const unknownWolf = Object.keys(lvl.gridCells).find(c => !lvl.gridCells[c].disabled && lvl.gridCells[c].isWolf && cardMarks[c] !== 'wolf');
      const targetCoord = unknownWolf || Object.keys(lvl.gridCells).find(c => !lvl.gridCells[c].disabled);

      if (targetCoord) {
        eyeRemaining--;
        document.getElementById('eyeCount').innerText = eyeRemaining;
        const cell = lvl.gridCells[targetCoord];
        SoundFx.win();

        if (cell.isWolf) {
          cardMarks[targetCoord] = 'wolf';
          const cardEl = document.getElementById(`card-${targetCoord}`);
          const markEl = document.getElementById(`mark-${targetCoord}`);
          cardEl.className = "char-card state-wolf rounded-xl p-1 flex flex-col justify-between items-center relative cursor-pointer shadow-md";
          markEl.innerHTML = `<span class="bg-rose-600 text-white font-black text-[10px] px-1.5 py-0.5 rounded-full border border-white shadow">🐺 狼</span>`;
          markEl.style.opacity = '1';
          document.getElementById(`avatar-${targetCoord}`).innerHTML = AVATARS.wolf;
          alert(`【天眼透視！】${targetCoord}座位的【${cell.name}】身後浮現血色狼影，確定是狼人！`);
        } else {
          cardMarks[targetCoord] = 'good';
          const cardEl = document.getElementById(`card-${targetCoord}`);
          const markEl = document.getElementById(`mark-${targetCoord}`);
          cardEl.className = "char-card state-good rounded-xl p-1 flex flex-col justify-between items-center relative cursor-pointer shadow-md";
          markEl.innerHTML = `<span class="bg-emerald-600 text-white font-black text-[10px] px-1.5 py-0.5 rounded-full border border-white shadow">好人</span>`;
          markEl.style.opacity = '1';
          alert(`【天眼透視！】${targetCoord}座位的【${cell.name}】身懷聖堂徽章，確定是好人！`);
        }
      }
    }

    /* =====================================================================
       6. 提交判定與邏輯復盤
       ===================================================================== */
    function verifySubmission() {
      const lvl = GAME_LEVELS[currentLevelIndex];
      const cells = lvl.gridCells;

      // 檢查是否所有狼人都被準確標出，且沒有將好人錯標為狼人
      let allWolvesFound = true;
      let wrongAccusation = false;

      Object.keys(cells).forEach(c => {
        if (!cells[c].disabled) {
          if (cells[c].isWolf && cardMarks[c] !== 'wolf') {
            allWolvesFound = false;
          }
          if (!cells[c].isWolf && cardMarks[c] === 'wolf') {
            wrongAccusation = true;
          }
        }
      });

      const modal = document.getElementById('resultModal');
      const emoji = document.getElementById('resultEmoji');
      const title = document.getElementById('resultTitle');
      const desc = document.getElementById('resultDesc');
      const proof = document.getElementById('proofNotes');
      const nextBtn = document.getElementById('nextLevelBtn');

      if (allWolvesFound && !wrongAccusation) {
        SoundFx.win();
        saveClearedLevel(lvl.levelId);
        emoji.innerText = "🏆";
        title.innerText = "推敲成功！真相大白！";
        title.className = "text-xl font-black text-amber-400 comic-font mb-1";
        desc.innerText = `太棒了！所有潛伏在人群中的 ${lvl.wolfCount} 隻狼人全數被你捉拿歸案！`;
        proof.innerText = lvl.proof;
        nextBtn.classList.remove('hidden');
      } else {
        SoundFx.lose();
        lives = Math.max(0, lives - 1);
        document.getElementById('livesText').innerText = lives;

        emoji.innerText = "💔";
        title.innerText = "審判失誤！有狼人逃脫！";
        title.className = "text-xl font-black text-rose-500 comic-font mb-1";
        desc.innerText = wrongAccusation 
          ? "你把無辜的好人當成狼人了！好人是不會撒謊的，請再次比對坐標。" 
          : `場上仍有狼人未被揪出（本案共有 ${lvl.wolfCount} 隻狼人），請檢查各行列發言！`;
        proof.innerText = "提示：好人所說的行（橫向）與列（直向）狼人數量必定真實；若有人的供詞與其他人衝突，該人必定在撒謊！";
        nextBtn.classList.add('hidden');
      }

      modal.classList.remove('hidden');
    }

    function closeResultModal() {
      document.getElementById('resultModal').classList.add('hidden');
    }

    function goToNextCase() {
      closeResultModal();
      if (currentLevelIndex < GAME_LEVELS.length - 1) {
        currentLevelIndex++;
        loadCurrentLevel();
      } else {
        alert("恭喜你！全數 50 宗棋盤迷案已全部推敲破案！你是名副其實的本格大偵探！");
      }
    }

    /* =====================================================================
       7. 50 關選單與儲存
       ===================================================================== */
    function toggleLevelModal() {
      const modal = document.getElementById('levelModal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        renderLevelSelector();
      }
    }

    function renderLevelSelector() {
      const container = document.getElementById('levelGridContainer');
      container.innerHTML = '';
      const cleared = getClearedLevels();

      for (let i = 1; i <= 50; i++) {
        const btn = document.createElement('button');
        const isCurrent = (i - 1) === currentLevelIndex;
        const isDone = cleared.includes(i);

        btn.className = `p-2 rounded-xl font-bold font-mono text-xs flex flex-col items-center justify-center border ${
          isCurrent 
            ? 'bg-amber-400 text-slate-950 border-amber-300' 
            : isDone 
              ? 'bg-emerald-800/80 text-emerald-200 border-emerald-500' 
              : 'bg-purple-900/60 text-purple-300 border-purple-700'
        }`;
        btn.innerHTML = `<span>${i}</span><span>${isDone ? '⭐' : ''}</span>`;
        btn.onclick = () => {
          currentLevelIndex = i - 1;
          loadCurrentLevel();
          toggleLevelModal();
        };
        container.appendChild(btn);
      }
    }

    function getClearedLevels() {
      try {
        return JSON.parse(localStorage.getItem('board_werewolf_cleared') || '[]');
      } catch(e) { return []; }
    }

    function saveClearedLevel(lvlId) {
      const list = getClearedLevels();
      if (!list.includes(lvlId)) {
        list.push(lvlId);
        localStorage.setItem('board_werewolf_cleared', JSON.stringify(list));
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadCurrentLevel();
    });
  </script>
</body>
